openapi: 3.1.0
info:
  title: DokoSoko Vendor Integration APIs
  version: 1.0.0
  description: >-
    Reference contract for the vendor endpoints DokoSoko calls to resolve
    entitlements, proxy customer usage reports, deliver consented bug reports
    and feedback, authorize custom-tool execution, and create short-lived package downloads. The
    /v1/package/download path is normative. DokoSoko stores a configurable fixed
    HTTPS URL for every other operation, so their paths are illustrative.
servers:
  - url: https://hooks.vendor.example.com
tags:
  - name: Identity policy
  - name: Account usage
  - name: Support reporting
  - name: Tool policy
  - name: Package delivery
paths:
  /entitlements:
    post:
      tags: [Identity policy]
      operationId: resolveEntitlements
      summary: Resolve product entitlements for a vendor identity
      description: >-
        Called during DokoSoko OAuth authorization. The bearer token is the
        vendor access token obtained from the configured OIDC provider. Any
        network, HTTP, or response-validation failure denies authorization.
      security: [{ vendorAccessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntitlementRequest" }
            example:
              subject: user_123
              vendor_organisation_id: org_customer_42
              installation_id: install_customer_42_prod
              product_id: prod_dokosoko
      responses:
        "200":
          description: Stable entitlement identifiers and their current enabled state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementResponse" }
              example:
                entitlements:
                  developer.pro: true
                  access.instances.create: true
                  production.write: false
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /usage:
    post:
      tags: [Account usage]
      operationId: getUsageReport
      summary: Return customer-defined usage values for a vendor identity
      description: >-
        Called on demand by the authenticated Private MCP usage.get tool. The
        bearer token is a dedicated encrypted service credential. DokoSoko
        supplies the authenticated subject and vendor organisation, validates
        the bounded response envelope, and proxies it without calculating,
        caching, or persisting any returned value.
      security: [{ serviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsageRequest" }
            example:
              product_id: prod_dokosoko
              subject: https://id.vendor.example.com|user_123
              vendor_organisation_id: org_customer_42
              installation_id: install_customer_42_prod
      responses:
        "200":
          description: Ordered, vendor-defined scalar usage values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
              example:
                as_of: "2026-08-19T05:30:00Z"
                items:
                  - { key: credits_used, label: Used, value: 720, format: number, unit: credits }
                  - { key: credits_available, label: Available, value: 280, format: number, unit: credits }
                  - { key: next_renewal, label: Next renewal, value: "2026-09-01T00:00:00Z", format: datetime }
                  - { key: trial_completion, label: Trial completes, value: "2026-08-31T23:59:59Z", format: datetime }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /authorize-tool:
    post:
      tags: [Tool policy]
      operationId: authorizeToolExecution
      summary: Authorize one custom-tool execution
      description: >-
        Called after local schema, entitlement, and confirmation checks but
        before the fixed tool hook executes. Argument values and the inbound
        DokoSoko access token are deliberately excluded. Failures deny execution.
      security: [{ serviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolAuthorizationRequest" }
            example:
              operation: tool.execute
              tool: billing.create_invoice
              product_id: prod_dokosoko
              subject: https://id.vendor.example.com|user_123
              vendor_organisation_id: org_customer_42
              installation_id: install_customer_42_prod
              argument_keys: [account_id, amount, currency]
      responses:
        "200":
          description: Explicit execution decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationDecision" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /bug-reports:
    post:
      tags: [Support reporting]
      operationId: deliverBugReport
      summary: Accept one consented connector bug report
      description: >-
        Called by the durable reporting outbox after an authenticated agent has
        previewed the exact report and supplied explicit user-confirmation
        metadata. The bearer token is the dedicated encrypted bug-hook
        credential. The submission ID is also sent as both Idempotency-Key and
        X-DokoSoko-Submission-ID; vendors must create at most one external
        ticket for that ID.
      security: [{ serviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportDeliveryRequest" }
      responses:
        "200":
          description: Accepted with optional external ticket metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDeliveryResponse" }
        "201":
          description: External ticket created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDeliveryResponse" }
        "202":
          description: Accepted for asynchronous processing with optional external metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDeliveryResponse" }
        "204": { description: Accepted without external ticket metadata. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /feedback:
    post:
      tags: [Support reporting]
      operationId: deliverFeedback
      summary: Accept one consented connector feedback submission
      description: >-
        Uses the same durable, idempotent delivery envelope as bug reporting
        with a separate fixed URL and encrypted credential. User contact fields
        are omitted unless the user explicitly allowed follow-up.
      security: [{ serviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportDeliveryRequest" }
      responses:
        "200":
          description: Accepted with optional external ticket metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDeliveryResponse" }
        "201":
          description: External feedback record created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDeliveryResponse" }
        "202":
          description: Accepted for asynchronous processing with optional external metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDeliveryResponse" }
        "204": { description: Accepted without external record metadata. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/package/download:
    post:
      tags: [Package delivery]
      operationId: createPackageDownload
      summary: Create an idempotent short-lived package download
      description: >-
        Used only by download-mode packages. DokoSoko may retry network errors,
        429 responses, and 5xx responses with the same Idempotency-Key. The
        vendor must retain idempotency results for at least 24 hours and return
        the same HTTP status and response body for the same key and payload.
        Reusing a key with a different payload returns 409. Return a
        credential-free HTTPS URL with exact integrity metadata and an expiry at
        least five minutes and no more than one hour in the future. DokoSoko
        revalidates the destination, never forwards the service credential to
        the returned URL, and enforces the checksum and size. Successful
        responses should include Cache-Control: no-store.
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DokoSokoRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageDownloadRequest" }
            example:
              external_package_id: vendor-sdk-node-2.4.1
      responses:
        "200":
          description: Short-lived, credential-free artifact location.
          headers:
            Cache-Control:
              description: Prevents storage of short-lived artifact credentials by intermediaries.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageDownload" }
              example:
                id: download_01
                url: https://downloads.vendor.example.com/leases/download_01
                sha256: 81b637d8f6d2c6b1f4e9d349a442e980a84161f96ea101da2c96cf86723bb7ef
                size_bytes: 184320
                expires_at: "2026-08-22T12:10:00Z"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable identifier reused for every retry of one logical download creation.
      schema: { type: string, pattern: '^pkgdl_[a-f0-9]{32}$' }
    DokoSokoRequestID:
      name: X-DokoSoko-Request-ID
      in: header
      required: true
      description: Unique correlation identifier for one HTTP attempt. A retry uses a new request ID and the same Idempotency-Key.
      schema: { type: string, pattern: '^req_[a-f0-9]{32}$' }
  securitySchemes:
    vendorAccessToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: End-user vendor token obtained by DokoSoko during upstream OIDC authorization.
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Vendor-issued server credential stored encrypted by DokoSoko.
  responses:
    Error:
      description: Structured error without tokens, credentials, or argument values.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    EntitlementRequest:
      type: object
      additionalProperties: false
      properties:
        subject: { type: string, minLength: 1 }
        vendor_organisation_id: { type: string }
        installation_id:
          type: string
          description: Stable installation identifier copied from the configured OIDC claim, when present.
        product_id: { type: string, minLength: 1 }
      required: [subject, vendor_organisation_id, product_id]
    EntitlementResponse:
      type: object
      additionalProperties: false
      properties:
        entitlements:
          type: object
          additionalProperties: { type: boolean }
      required: [entitlements]
    UsageRequest:
      type: object
      additionalProperties: false
      properties:
        product_id: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1 }
        vendor_organisation_id: { type: string }
        installation_id:
          type: string
          description: Stable installation identifier copied from the authenticated DokoSoko principal, when present.
      required: [product_id, subject, vendor_organisation_id]
    UsageReport:
      type: object
      additionalProperties: false
      properties:
        as_of: { type: string, format: date-time }
        items:
          type: array
          maxItems: 50
          description: Ordered customer-defined values; keys must be unique within a report.
          items: { $ref: "#/components/schemas/UsageItem" }
      required: [as_of, items]
    UsageItem:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$' }
        label: { type: string, minLength: 1, maxLength: 80 }
        value:
          description: Vendor-provided scalar value. Null means currently unavailable.
          oneOf:
            - { type: string, maxLength: 500 }
            - { type: number }
            - { type: boolean }
            - { type: "null" }
        format:
          type: string
          enum: [text, number, percentage, date, datetime, duration, currency]
        unit: { type: string, maxLength: 32 }
        description: { type: string, maxLength: 500 }
      required: [key, label, value]
    ToolAuthorizationRequest:
      type: object
      additionalProperties: false
      properties:
        operation: { const: tool.execute }
        tool: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63}$' }
        product_id: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1 }
        vendor_organisation_id: { type: string }
        installation_id:
          type: string
          description: Stable installation identifier copied from the authenticated DokoSoko principal, when present.
        argument_keys:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Sorted property names only; argument values are never included.
      required: [operation, tool, product_id, subject, vendor_organisation_id, argument_keys]
    AuthorizationDecision:
      type: object
      additionalProperties: false
      properties:
        allowed: { type: boolean }
        reason: { type: string, maxLength: 500 }
      required: [allowed]
    ReportDeliveryRequest:
      type: object
      additionalProperties: false
      properties:
        submission_id: { type: string, minLength: 1 }
        created_at: { type: string, format: date-time }
        report: { $ref: "#/components/schemas/ReportEnvelope" }
      required: [submission_id, created_at, report]
    ReportEnvelope:
      type: object
      additionalProperties: false
      properties:
        schema_version: { const: "2026-08-19" }
        kind: { type: string, enum: [bug, feedback] }
        bug: { $ref: "#/components/schemas/BugReport" }
        feedback: { $ref: "#/components/schemas/FeedbackReport" }
        reporter: { $ref: "#/components/schemas/ReportReporterContext" }
        product: { $ref: "#/components/schemas/ReportProductContext" }
        source: { const: private_mcp }
        confirmed_at: { type: string, format: date-time }
        request_id: { type: string }
      required: [schema_version, kind, reporter, product, source, confirmed_at, request_id]
      oneOf:
        - properties: { kind: { const: bug } }
          required: [bug]
        - properties: { kind: { const: feedback } }
          required: [feedback]
    ReportReporterContext:
      type: object
      additionalProperties: false
      properties:
        subject: { type: string, minLength: 1 }
        display_name: { type: string, description: Present only when allow_contact is true. }
        email: { type: string, format: email, description: Present only when allow_contact is true. }
        vendor_organisation_id: { type: string }
        installation_id: { type: string }
        allow_contact: { type: boolean }
      required: [subject, allow_contact]
    ReportProductContext:
      type: object
      additionalProperties: false
      properties:
        product_id: { type: string, minLength: 1 }
        product_name: { type: string, minLength: 1 }
        product_version_id: { type: string }
        product_version: { type: string }
        manifest_hash: { type: string }
        catalog_revision: { type: integer, format: int64 }
        selection_source: { type: string }
        environment_id: { type: string }
        installation_id: { type: string }
      required: [product_id, product_name]
    BugReport:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 10000 }
        reproduction_steps:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 1000 }
        expected_behavior: { type: string, maxLength: 4000 }
        actual_behavior: { type: string, maxLength: 4000 }
        error_code: { type: string, maxLength: 120 }
        error_message: { type: string, maxLength: 8000 }
        stack_trace: { type: string, maxLength: 16000 }
        diagnostic_context: { type: string, maxLength: 20000 }
        related_tool: { type: string, maxLength: 160 }
        integration_run_id: { type: string, maxLength: 160 }
        severity: { type: string, enum: [unknown, low, medium, high, critical] }
        allow_contact: { type: boolean }
      required: [summary, description]
    FeedbackReport:
      type: object
      additionalProperties: false
      properties:
        message: { type: string, minLength: 1, maxLength: 10000 }
        category: { type: string, enum: [general, usability, documentation, performance, feature_request, other] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        related_tool: { type: string, maxLength: 160 }
        integration_run_id: { type: string, maxLength: 160 }
        allow_contact: { type: boolean }
      required: [message]
    ReportDeliveryResponse:
      type: object
      additionalProperties: false
      properties:
        external_id: { type: string, maxLength: 200 }
        external_url: { type: string, format: uri, pattern: '^https://', maxLength: 2000, description: Optional HTTPS link to the external ticket or feedback record. }
    PackageDownloadRequest:
      type: object
      additionalProperties: false
      properties:
        external_package_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Vendor-owned opaque identifier configured on the exact package artifact. It is not a DokoSoko resource ID.
      required: [external_package_id]
    PackageDownload:
      type: object
      description: Clients must ignore fields they do not recognize so this response can evolve additively.
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri, pattern: '^https://', description: Short-lived credential-free HTTPS artifact URL with no user information or fragment and no port other than 443. Query parameters are allowed for signed URLs. }
        sha256: { type: string, pattern: "^[A-Fa-f0-9]{64}$", description: Exact SHA-256 digest enforced by DokoSoko. }
        size_bytes: { type: integer, format: int64, minimum: 0, maximum: 1073741824, description: Exact artifact size in bytes; the current gateway limit is 1 GiB. }
        expires_at: { type: string, format: date-time, description: At least five minutes and no more than one hour after response creation. }
      required: [id, url, sha256, size_bytes, expires_at]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean, default: false }
            request_id: { type: string }
          required: [code, message]
      required: [error]
