        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/resources/contracts/{binding_id}:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
      - name: binding_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAPIContractBinding
      tags: ["API Resources"]
      responses:
        '200':
          description: Contract binding.
