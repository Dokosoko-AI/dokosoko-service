                $ref: '#/components/schemas/SourcePublicationList'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/sources/{source_id}/publish:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - $ref: '#/components/parameters/SourceID'
    post:
      operationId: publishSource
      description: Atomically publishes an explicitly acknowledged selection from the exact latest completed crawl generation. Failed, partial, stale, or quarantined generations are rejected.
      requestBody:
        $ref: '#/components/requestBodies/SourcePublication'
      responses:
        '200':
          description: Exact reviewed generation published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePublishResult'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/sources/{source_id}/visibility:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: source_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateSourceVisibility
      description: A private-to-public transition requires acknowledge_public=true and is audit logged. A public-to-private transition is immediate.
      requestBody:
        $ref: '#/components/requestBodies/VisibilityChange'
      responses:
        '200':
          description: Updated source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '409':
          $ref: '#/components/responses/ConfirmationOrRevisionConflict'
        '422':
          description: The resource is quarantined or otherwise unsafe for anonymous publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/products/{product_id}/tools:
    parameters:
      - $ref: '#/components/parameters/ProductID'
    get:
      operationId: listTools
      responses:
        '200':
          description: Draft and published custom tools; secrets and fixed destinations are redacted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolList'
    post:
      operationId: createTool
      description: >-
        Creates a draft one-call HTTP tool with bounded JSON Schemas, a fixed credential-free destination, explicit request and response mappings, vendor-neutral upstream
        authentication, and an authorization policy. Public destinations use HTTPS on the default port. Local development destinations use HTTP on localhost, a localhost subdomain,
        127.0.0.1, or ::1. Stored credentials are accepted only in the write-only credential field, encrypted immediately, and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToolRequest'
      responses:
        '201':
          description: Draft tool created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tool-builder/validate:
    parameters:
      - $ref: '#/components/parameters/ProductID'
    post:
      operationId: validateToolDraft
      description: >-
        Deterministically normalizes and validates one non-secret HTTP tool draft. It does not resolve DNS, call the candidate endpoint, or call an AI provider. The nested
        credential_present value is ignored; credential presence is derived from the persisted base tool or credential_will_be_supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolDraftContext'
      responses:
        '200':
          description: Authoritative local validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDraftValidation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tool-builder/propose:
    parameters:
      - $ref: '#/components/parameters/ProductID'
    post:
      operationId: proposeToolDraft
      description: >-
        Continues a bounded builder conversation with the configured Analysis AI workload. The assistant may ask a clarifying question with no changes or return a complete
        candidate draft; every modification remains a reviewable field diff. Chat history is caller-supplied context and is not persisted with the tool. AI assistance never saves,
        publishes, binds, tests, or calls a tool or candidate endpoint. The separate write-only credential field is excluded from provider payloads. Administrators must keep
        secrets out of every other message and draft field; common credential patterns are rejected, but arbitrary free text cannot be proven secret-free.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolDraftProposalInput'
      responses:
        '200':
          description: Reviewable AI proposal and deterministic findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDraftProposal'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tool-builder/import:
    parameters:
      - $ref: '#/components/parameters/ProductID'
    post:
      operationId: importToolDraft
      description: >-
        Parses pasted cURL, Postman Collection, or OpenAPI text into reviewable non-secret HTTP tool candidates. Import is local-only; openapi_url is recognized but rejected
        because this endpoint never fetches URLs. Embedded credential material is detected and excluded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolDraftImportInput'
      responses:
        '200':
          description: At most 50 imported candidates with deterministic findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDraftImportResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tool-builder/analyse:
    parameters:
      - $ref: '#/components/parameters/ProductID'
    post:
      operationId: analyseToolDraft
      description: >-
        Runs authoritative deterministic validation and adds advisory warning or information findings from the configured Analysis AI workload when available. AI cannot remove or
        downgrade deterministic errors, and neither phase calls the candidate endpoint. Credential material is forbidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolDraftAnalysisInput'
      responses:
        '200':
          description: Combined deterministic and advisory analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDraftAnalysis'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tools/{tool_id}:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getToolEditorResource
      description: >-
        Returns the complete administrative tool contract. HTTP tools include their fixed credential-free endpoint, non-secret upstream authentication, mappings, examples, and
        credential-presence bit; credential material is never returned.
      responses:
        '200':
          description: Administrative tool editor representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTool'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceToolDraft
      description: >-
        Replaces a draft tool contract using optimistic revision control. The optional write-only credential rotates the encrypted upstream credential; omitting it preserves a
        compatible existing credential. Published tools and their identity are immutable; clone a published tool to create a new editable draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceToolDraftRequest'
      responses:
        '200':
          description: Updated draft tool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTool'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tools/{tool_id}/clone:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cloneToolDraft
      description: >-
        Copies one exact HTTP draft or published source revision into a new editable draft with a new immutable namespace/name identity. The required revision provides optimistic
        concurrency control; a stale source revision is rejected before credential storage. Credentials are never copied; authentication modes that require one must receive a new
        value through the write-only credential field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneToolRequest'
      responses:
        '201':
          description: Independent draft tool clone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTool'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tools/{tool_id}/dry-run:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: dryRunTool
      description: Validates arguments, resolves the fixed destination and authorization policy, and reports readiness warnings without performing any network call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolDryRunRequest'
      responses:
        '200':
          description: Network-free tool validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDryRun'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tools/{tool_id}/test-confirmations:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createToolTestConfirmation
      description: >-
        Creates a five-minute, single-use confirmation for one exact HTTP tool revision and canonical argument hash when the method is non-GET or the stored authorization policy
        requires explicit confirmation. Mutation live tests are eligible only when idempotency metadata is required by the stored policy. The administrator must type the full tool
        name and acknowledge the real upstream request. The raw nonce is returned once and only its digest is retained.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolTestConfirmationRequest'
      responses:
        '201':
          description: One-time exact-revision confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolTestConfirmation'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tools/{tool_id}/test-runs:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listToolTestRuns
      description: >-
        Lists unexpired, tenant- and tool-scoped sanitized evidence newest first. Raw requests, responses, headers, scalar values, credentials, destinations, actors, nonces,
        idempotency keys, and argument hashes are never returned.
      responses:
        '200':
          description: Unexpired sanitized test evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolTestRunList'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: runToolLiveTest
      description: >-
        Performs one exact-revision HTTP action test against the persisted fixed destination after deterministic validation. OAuth client-credentials authentication may first make
        one bounded request to its separately fixed token endpoint when no valid cached token exists; neither request is retried or redirected. A matching single-use confirmation
        and a policy-enforced idempotency key are required for every mutation live test. Before any outbound work the server durably records a sanitized execution intent; if the
        terminal outcome cannot be recorded after the request, the API returns tool_test_outcome_indeterminate and explicitly forbids retry. Delegated OAuth is not eligible for an
        administrator live upstream call because this route never accepts an end-user token; a direct request returns a controlled zero-network-call authorization finding. Only
        short-lived sanitized structural evidence is retained; raw bodies, headers, scalar values, credentials, destinations, actors, nonce material, and idempotency keys are
        discarded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolTestRunRequest'
      responses:
        '201':
          description: Short-lived sanitized evidence from the controlled live test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolTestRun'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tools/{tool_id}/test-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getToolTestRun
      description: Returns one exact unexpired sanitized run only when its tenant, product and tool scope match the route.
      responses:
        '200':
          description: Exact short-lived sanitized run evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolTestRun'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/tools/{tool_id}/test-runs/{run_id}/analyse:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: tool_id
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: analyseToolTestRun
      description: >-
        Contacts the exact configured Analysis provider only after an explicit true consent boolean, an exact server-recomputed evidence-hash match, and durable persistence of the
        consented provider-call intent. The provider binding is rechecked before disclosure and this consented workload never fails over to a backup provider. The provider receives
        value-free shapes projected to schema-declared property names, JSON types, and array lengths; bounded metrics and finding codes without diagnostic paths; a structural
        non-secret contract; the latest question; and bounded untrusted chat history. Contract schemas omit stored descriptions, annotations, examples/defaults/comments, enum/const
        literal values, patterns, and references; value-free markers may disclose only enum cardinality or const presence so the provider can reason about a supported constraint
        repair. Unexpected upstream property names are excluded. The provider never receives the evidence hash, raw request/response values or bodies, headers, credentials, nonce
        or actor data, destinations or query values, examples, or internal IDs. The response is advisory and may contain a complete locally validated proposal bound to the exact
        current base revision; it never saves, publishes, clones, binds, or calls the tested upstream. Published tools must be cloned before any proposed change is reviewed in
        Builder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolTestAnalysisRequest'
      responses:
        '200':
          description: Exact-evidence advisory reply and optional locally validated human-review proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolTestAnalysis'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
