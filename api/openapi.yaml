          $ref: '#/components/schemas/JSONSchema'
        output_schema:
          $ref: '#/components/schemas/JSONSchema'
        endpoint:
          type: string
          format: uri
          maxLength: 8192
          description: >-
            Required for an HTTP-backed tool. Public destinations use credential-free HTTPS on the default port. Local development destinations use HTTP on localhost, a localhost
            subdomain, 127.0.0.1, or ::1 and may use a local port. Query strings and fragments are forbidden. delegated_oauth additionally requires the configured authorization API
            origin. Ignored for managed MCP-backed tools.
        http_method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          description: Required for an HTTP-backed tool and restricted to these five methods. Managed MCP-backed tools retain their MCP method and ignore this request value.
        upstream_auth:
          $ref: '#/components/schemas/ToolUpstreamAuth'
        credential:
          $ref: '#/components/schemas/ToolCredential'
        request_mapping:
          $ref: '#/components/schemas/ToolRequestMapping'
        response_mapping:
          $ref: '#/components/schemas/ToolResponseMapping'
        request_example:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Supply null to clear the current request example.
        response_example:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Supply null to clear the current response example.
        authorization_policy:
          $ref: '#/components/schemas/ToolAuthorizationPolicy'
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
          default: 10000
        revision:
          type: integer
          format: int64
          minimum: 1
      required:
