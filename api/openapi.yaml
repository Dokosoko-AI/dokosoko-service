        - revision
        - arguments
    ToolTestJSONShape:
      type: object
      additionalProperties: false
      description: >-
        Bounded value-free JSON structure. Only ordinary schema-declared property names or positional redaction placeholders and JSON types may be retained; scalar values never
        are.
      properties:
        type:
          type: string
          enum:
            - object
            - array
            - string
            - number
            - integer
            - boolean
            - 'null'
            - unknown
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ToolTestJSONShape'
        items:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ToolTestJSONShape'
        length:
