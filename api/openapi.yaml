openapi: 3.1.0
info:
  title: DokoSoko Control Plane API
  version: 4.0.0
  description: >-
    Control-plane contract for DokoSoko's deployment-owned developer assets, API Resources bindings, credentials, recipes, reviewed tools, native tools, and MCP connector.
    Documentation publications, contract revisions, SDK releases/content, maps, and citations are exact and immutable; bindings never auto-upgrade an SDK release. Publication requires
    explicit human review. Cookie-authenticated mutations also require CSRF validation. Public MCP is optional and read-only.
tags:
  - name: Health
    description: Service health and operational readiness.
  - name: Catalog Administration
    description: Deployment, organisation, product, environment, API, and customer-account administration.
  - name: Setup and Access
    description: First-run setup, administrator sessions, root users, and system diagnostics.
  - name: Runtime
    description: Runtime service connections, credentials, rotation, checks, and usage.
  - name: Authorization
    description: Grant definitions, authorization points, resource sets, and integration policy bindings.
  - name: Sources
    description: Documentation source acquisition, crawl runs, review, publication, and visibility.
  - name: Tools
    description: Tool Builder, reviewed tools, dry runs, test evidence, publication, and retirement.
  - name: MCP
    description: MCP connections, previews, public resources, OAuth, and agent setup.
  - name: Identity
    description: Identity-provider configuration, validation, activation, and customer identity resolution.
  - name: Support
    description: Bounded support submissions and their administrative review.
  - name: AI Configuration
    description: Provider connections, workload profiles, prompt settings, budgets, and usage.
  - name: Recipes and Analysis
    description: Product analyses, evidence-grounded recipes, review, rework, approval, and publication.
  - name: Native Plugins
    description: Native plugin discovery and host-owned plugin state.
  - name: Developer Assets
    description: Deployment-owned ingestion runs, catalog roots, and shared lifecycle evidence.
  - name: Documentation
    description: Normalized documentation, reusable collections, exact revisions, and deployment publications.
  - name: API Contracts
    description: Reusable OpenAPI roots, candidates, validation, and immutable reviewed revisions.
  - name: SDK Catalog
    description: Deployment-owned SDK packages, exact releases, reviewed content, and compatibility projections.
  - name: API Resources
    description: Attachment-only API bindings and immutable developer-asset publication snapshots.
  - name: Query and Traces
    description: Bounded retrieval over exact published scopes and its inspectable traces.
  - name: Advisory AI
    description: Explicit schema-constrained advisory runs over exact reviewed evidence.
servers:
  - url: https://dokosoko.example.com
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: ["Health"]
      security: []
      operationId: health
      responses:
        '200':
          description: Service is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                  - status
  /readyz:
    get:
      tags: ["Health"]
      security: []
      operationId: readiness
      responses:
        '200':
          description: Persistence is reachable and migrations are applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/deployment:
    get:
      tags: ["Catalog Administration"]
      operationId: getDeployment
      responses:
        '200':
          description: Singleton DokoSoko deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
    post:
      tags: ["Catalog Administration"]
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentInput'
      responses:
        '201':
          description: Deployment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '409':
          $ref: '#/components/responses/Error'
    patch:
      tags: ["Catalog Administration"]
      operationId: updateDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentInput'
      responses:
        '200':
          description: Deployment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/native-plugins:
    get:
      tags: ["Native Plugins"]
      operationId: listNativePlugins
      description: Lists source-registered native plugin lifecycle, declared capabilities, tool contracts, and configuration key status. Configuration values are never returned.
      responses:
        '200':
          description: Native plugin status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativePluginList'
  /api/v1/native-plugins/{plugin_id}/state:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
    patch:
      tags: ["Native Plugins"]
      operationId: updateNativePluginState
      description: Enables or disables a source-registered plugin. Environment-disabled plugins cannot be enabled through the API. The change is audit logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
      responses:
        '200':
          description: Updated native plugin status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativePlugin'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/environments:
    get:
      tags: ["Catalog Administration"]
      operationId: listDeploymentEnvironments
      responses:
        '200':
          description: Deployment environments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentList'
    post:
      tags: ["Catalog Administration"]
      operationId: createDeploymentEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organisation_id:
                  type: string
                name:
                  type: string
                slug:
                  type: string
                is_production:
                  type: boolean
              required:
                - organisation_id
                - name
                - slug
      responses:
        '201':
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
  /api/v1/integrations:
    get:
      tags: ["Catalog Administration"]
      operationId: listIntegrations
      responses:
        '200':
          description: Versioned API Integrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationList'
    post:
      tags: ["Catalog Administration"]
      operationId: createIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
      responses:
        '201':
          description: Integration created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: ["Catalog Administration"]
      operationId: getIntegration
      responses:
        '200':
          description: Integration, immutable revision history, and current publish readiness/diff.
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration:
                    $ref: '#/components/schemas/Integration'
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntegrationRevision'
                  publish_status:
                    $ref: '#/components/schemas/IntegrationPublishStatus'
                required:
                  - integration
                  - revisions
                  - publish_status
    put:
      tags: ["Catalog Administration"]
      operationId: replaceIntegration
      description: >-
        Replaces the complete mutable Integration representation. Changing visibility from private to public requires acknowledge_public=true, and the change does not appear
        publicly until the resulting Integration snapshot is published.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceIntegrationRequest'
      responses:
        '200':
          description: Integration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/publish:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: ["Catalog Administration"]
      operationId: publishIntegration
      description: >-
        Publishes only the exact server-preflight candidate identified by its optimistic Integration revision and manifest hash. A changed candidate is rejected and must be
        preflighted again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishIntegrationRequest'
      responses:
        '201':
          description: Immutable Integration revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationRevision'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/preflight:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: ["Catalog Administration"]
      operationId: preflightIntegration
      description: Rebuilds and validates the exact API candidate. Required documentation, contracts, SDK references, identity, authorization, tool, and runtime-service gates fail closed.
      responses:
        '200':
          description: Server-backed candidate preflight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationPreflight'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/authorization:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: ["Runtime"]
      operationId: getIntegrationAuthorization
      description: >-
        Returns the API endpoint binding and reusable Authorization metadata for one API. Credential values and internal vault identifiers are never returned.
      responses:
        '200':
          description: API Authorization binding with credential-redacted metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSetup'
        '404':
          $ref: '#/components/responses/Error'
    put:
      tags: ["Runtime"]
      operationId: configureIntegrationAuthorization
      description: >-
        Binds one existing Authorization or creates and binds a reusable Authorization for the API endpoint. Credential input is write-only and is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeSetupRequest'
      responses:
        '200':
          description: Updated API Authorization binding with credential-redacted metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSetup'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/authorizations:
    get:
      tags: ["Runtime"]
      operationId: listAuthorizations
      description: Lists active shared Authorization profiles that may be reused by any API in the deployment. Secret values and vault identifiers are never returned.
      responses:
        '200':
          description: Reusable, credential-redacted Authorization profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeAuthorizationProfileList'
  /api/v1/authorizations/{authorization_id}:
    parameters:
      - name: authorization_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: ["Runtime"]
      operationId: getAuthorization
      description: Returns one reusable Authorization and its credential-redacted version metadata.
      responses:
        '200':
          description: Credential-redacted runtime credential set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCredentialSet'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: ["Runtime"]
      operationId: updateAuthorization
      description: Updates non-secret Authorization metadata and hook configuration using optimistic concurrency. The authentication method is immutable; create a new Authorization to change it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthorizationRequest'
      responses:
        '200':
          description: Updated credential-redacted Authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCredentialSet'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/authorizations/{authorization_id}/usage:
    parameters:
      - name: authorization_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: ["Runtime"]
      operationId: getAuthorizationUsage
      description: Lists every API endpoint binding whose current environment revision references this Authorization.
      responses:
        '200':
          description: Authorization usage by API endpoint bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCredentialUsage'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/authorizations/{authorization_id}/rotate:
    parameters:
      - name: authorization_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: ["Runtime"]
      operationId: rotateAuthorizationCredential
      description: Stores and activates a new encrypted credential version while moving the prior active version into retiring state. The credential is write-only and is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateRuntimeCredentialRequest'
      responses:
        '200':
          description: Credential-redacted runtime credential set after rotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCredentialSet'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/authorizations/{authorization_id}/versions/{version_id}/revoke:
    parameters:
      - name: authorization_id
        in: path
        required: true
        schema:
          type: string
      - name: version_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: ["Runtime"]
      operationId: revokeAuthorizationCredentialVersion
      description: Revokes one exact credential version and returns only the credential set's updated redacted metadata. Repeating a completed revoke is idempotent.
      responses:
        '200':
          description: Credential-redacted runtime credential set after revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCredentialSet'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/authorization-points:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: ["Authorization"]
      operationId: listIntegrationAuthorizationPoints
      description: Lists declarative authorization points for one Integration. Authorization points contain no arbitrary callback URL or credential.
      responses:
        '200':
          description: Integration authorization points.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationPointList'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags: ["Authorization"]
      operationId: createIntegrationAuthorizationPoint
      description: Creates a declarative action-to-grants policy. Every required grant must already be active in the deployment grant registry, and destructive actions require confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorizationPointRequest'
      responses:
        '201':
          description: Authorization point created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationPoint'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/authorization-points/{authorization_point_id}:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
      - name: authorization_point_id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: ["Authorization"]
      operationId: updateIntegrationAuthorizationPoint
      description: Replaces mutable policy fields using optimistic revision control. The stable authorization-point key cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthorizationPointRequest'
      responses:
        '200':
          description: Authorization point updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationPoint'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/tools:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: ["Authorization"]
      operationId: listIntegrationToolBindings
      description: Lists reusable tools bound to this Integration at exact published tool and authorization-point revisions.
      responses:
        '200':
          description: Exact Integration tool bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationToolBindingList'
        '404':
          $ref: '#/components/responses/Error'
    put:
      tags: ["Authorization"]
      operationId: setIntegrationToolBindings
      description: >-
        Atomically replaces the complete tool-binding set. Every selection must name the tool's current exact published revision and one exact active authorization-point revision
        owned by the same Integration; an empty array clears all bindings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIntegrationToolBindingsRequest'
      responses:
        '200':
          description: Exact Integration tool bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationToolBindingList'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/resource-sets:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: ["Authorization"]
      operationId: attachIntegrationResourceSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resource_set_id:
                  type: string
                pinned_revision_id:
                  type: string
              required:
                - resource_set_id
      responses:
        '200':
          description: Explicit Integration resource link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResourceLink'
  /api/v1/integrations/{integration_id}/resource-sets/{resource_set_id}:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
      - name: resource_set_id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: ["Authorization"]
      operationId: detachIntegrationResourceSet
      responses:
        '204':
          description: Resource set detached.
  /api/v1/resource-sets:
    get:
      tags: ["Authorization"]
      operationId: listResourceSets
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - documentation
              - api
      responses:
        '200':
          description: Reusable resource sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSetList'
    post:
      tags: ["Authorization"]
      operationId: createResourceSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceSetInput'
      responses:
        '201':
          description: Resource set and first revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSet'
  /api/v1/grant-definitions:
    get:
      tags: ["Authorization"]
      operationId: listGrantDefinitions
      description: Lists the deployment-owned authorization vocabulary. A grant definition describes a key and never grants access by itself.
      responses:
        '200':
          description: Registered grant definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDefinitionList'
    post:
      tags: ["Authorization"]
      operationId: createGrantDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantDefinitionRequest'
      responses:
        '201':
          description: Grant definition registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDefinition'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/grant-definitions/{grant_id}:
    parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: ["Authorization"]
      operationId: updateGrantDefinition
      description: Replaces mutable grant metadata using optimistic revision control. The stable grant key cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGrantDefinitionRequest'
      responses:
        '200':
          description: Grant definition updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDefinition'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/resource-sets/{resource_set_id}:
    parameters:
      - name: resource_set_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: ["Authorization"]
      operationId: getResourceSet
      responses:
        '200':
          description: Resource set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSet'
    patch:
      tags: ["Authorization"]
      operationId: updateResourceSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceSetInput'
      responses:
        '200':
          description: Resource set with a new immutable content revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSet'
  /api/v1/resource-sets/{resource_set_id}/duplicate:
    parameters:
      - name: resource_set_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: ["Authorization"]
      operationId: duplicateResourceSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        '201':
          description: Independent resource-set copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSet'
  /api/v1/setup/status:
    get:
      tags: ["Catalog Administration"]
      security: []
      operationId: setupStatus
      responses:
        '200':
          description: First-run setup state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_complete:
                    type: boolean
                  requires_mfa:
                    const: true
                required:
                  - setup_complete
                  - requires_mfa
  /api/v1/setup/begin:
    post:
      tags: ["Catalog Administration"]
      security:
        - setupToken: []
      operationId: beginSetup
      requestBody:
        $ref: '#/components/requestBodies/RootInput'
      responses:
        '201':
          $ref: '#/components/responses/MFAEnrollment'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/setup/complete:
    post:
      tags: ["Catalog Administration"]
      security: []
      operationId: completeSetup
      requestBody:
        $ref: '#/components/requestBodies/MFACompletion'
      responses:
        '201':
          $ref: '#/components/responses/AuthenticatedRoot'
  /api/v1/auth/login:
    post:
      tags: ["Catalog Administration"]
      security: []
