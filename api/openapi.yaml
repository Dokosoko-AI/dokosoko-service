        - confirmation_nonce
        - expires_at
        - tool_id
        - tool_revision
    ToolTestRunRequest:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        arguments:
          type: object
          additionalProperties: true
          default: {}
          description: Validated against the exact stored input schema. Values may be sent to the fixed upstream for this one test but are never retained as evidence.
        confirmation_nonce:
          type: string
          maxLength: 200
          description: >-
            Required for non-GET tests or when the exact tool policy requires explicit confirmation, and consumed
            exactly once. Never retained in evidence or audit metadata.
        idempotency_key:
          type: string
          minLength: 16
          maxLength: 200
