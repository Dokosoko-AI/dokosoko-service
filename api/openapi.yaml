    JSONSchema:
      type: object
      additionalProperties: true
      description: >-
        A strict object-root JSON Schema accepted by DokoSoko's bounded validator. The encoded document is limited to 64 KiB and 10 nested levels, with at most 64 properties per
        object and 128 scalar enum values. Every object node must set additionalProperties=false. Local references, composition keywords, and remote resolution are unsupported.
    ToolAuthorizationPolicy:
      type: object
      additionalProperties: false
      properties:
        required_grants:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9_-]*(\.[a-z][a-z0-9_-]*)+$
            maxLength: 160
        confirmation_required:
          type: boolean
          default: false
        risk:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
          description: Defaults by method when omitted; critical tools require confirmation.
        idempotency_required:
          type: boolean
          default: false
    ToolUpstreamAuth:
      type: object
      additionalProperties: false
      description: >-
        Non-secret, vendor-neutral upstream authentication configuration. Credential values are supplied separately through a write-only credential field and are never represented
        here or returned by the API.
      properties:
        type:
          type: string
          enum:
            - delegated_oauth
            - none
            - bearer
            - authorization_scheme
            - api_key_header
            - api_key_query
            - basic
            - oauth_client_credentials
            - custom_header
        scheme:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[!#$%&'*+.^_`|~A-Za-z0-9-]{1,64}$
          description: >-
            RFC 9110 auth-scheme used only by authorization_scheme, for example Token, ApiKey, or SSWS. The runtime emits Authorization "<scheme> <credential>" without exposing the
            credential.
        header_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[!#$%&'*+.^_`|~A-Za-z0-9-]+$
          description: Header used by api_key_header or custom_header. Authorization, cookies, routing headers, connection headers, and method-override headers are rejected.
        query_name:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
          description: Query parameter used only by api_key_query. The fixed stored endpoint itself must not contain a query string.
        prefix:
          type: string
          maxLength: 64
          description: Optional non-secret prefix for api_key_header or custom_header. It is normalized and followed by one ASCII space before the credential.
        username:
          type: string
          minLength: 1
          maxLength: 255
          description: Non-secret username used only by basic. Colons and control characters are rejected.
        client_id:
          type: string
          minLength: 1
          maxLength: 255
          description: OAuth client identifier used only by oauth_client_credentials.
        token_url:
          type: string
          format: uri
          maxLength: 8192
          description: >-
            Credential-free OAuth token endpoint. Public endpoints use HTTPS on the default port; local development endpoints use HTTP on localhost, a localhost subdomain,
            127.0.0.1, or ::1 and may use a local port. User information, query strings, and fragments are forbidden.
        token_endpoint_auth_method:
          type: string
          enum:
            - client_secret_basic
            - client_secret_post
          default: client_secret_basic
          description: OAuth client-secret placement used only by oauth_client_credentials.
        scopes:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
        audience:
          type: string
          maxLength: 500
          description: Optional OAuth audience parameter.
        resource:
          type: string
          maxLength: 500
          description: Optional OAuth resource parameter.
      required:
        - type
      allOf:
        - if:
            properties:
              type:
                const: authorization_scheme
            required:
              - type
          then:
            required:
              - scheme
        - if:
            properties:
              type:
                enum:
                  - api_key_header
                  - custom_header
            required:
              - type
          then:
            required:
              - header_name
        - if:
            properties:
              type:
                const: api_key_query
            required:
              - type
          then:
            required:
              - query_name
        - if:
            properties:
              type:
                const: basic
            required:
              - type
          then:
            required:
              - username
        - if:
            properties:
              type:
                const: oauth_client_credentials
            required:
              - type
          then:
            required:
              - client_id
              - token_url
    ToolRequestMapping:
      type: object
      additionalProperties: false
      description: >-
        Maps input-schema properties into the fixed HTTP request. Unmapped GET inputs default to query parameters; unmapped inputs for other methods default to the JSON body. Path
        placeholders must be required by the input schema and explicitly mapped to path.
      properties:
        parameter_locations:
          type: object
          maxProperties: 64
          propertyNames:
            pattern: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
          additionalProperties:
            type: string
            enum:
              - path
              - query
              - header
              - body
      default: {}
    ToolResponseMapping:
      type: object
      additionalProperties: false
      properties:
        result_path:
          type: string
          maxLength: 500
          description: Optional dotted property path or JSON Pointer selecting the object validated against output_schema.
      default: {}
    ToolExample:
      type: object
      additionalProperties: true
      description: Non-secret JSON object no larger than 64 KiB, validated against the corresponding tool schema.
    ToolCredential:
      type: string
      format: password
      writeOnly: true
      minLength: 1
      maxLength: 16384
      description: >-
        Upstream credential encrypted immediately and never returned. Required for bearer, authorization_scheme, API-key, basic, OAuth client-credentials, and custom-header modes;
        rejected for none and delegated_oauth. Control characters are forbidden.
    CreateToolRequest:
      type: object
      additionalProperties: false
      properties:
        organisation_id:
          type: string
          deprecated: true
          description: Accepted for compatibility but ignored; organisation ownership is derived from product_id.
        namespace:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        description:
          type: string
          minLength: 1
          maxLength: 500
        input_schema:
          $ref: '#/components/schemas/JSONSchema'
        output_schema:
          $ref: '#/components/schemas/JSONSchema'
        endpoint:
          type: string
          format: uri
          maxLength: 8192
          description: >-
            Fixed credential-free destination with no user information, query string, or fragment. Public destinations use HTTPS on the default port. Local development destinations
            use HTTP on localhost, a localhost subdomain, 127.0.0.1, or ::1 and may use a local port. delegated_oauth additionally requires the configured authorization API origin.
        http_method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        upstream_auth:
          $ref: '#/components/schemas/ToolUpstreamAuth'
        credential:
          $ref: '#/components/schemas/ToolCredential'
        request_mapping:
          $ref: '#/components/schemas/ToolRequestMapping'
        response_mapping:
          $ref: '#/components/schemas/ToolResponseMapping'
        request_example:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Non-secret request object no larger than 64 KiB.
        response_example:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Non-secret response object no larger than 64 KiB.
        authorization_policy:
          $ref: '#/components/schemas/ToolAuthorizationPolicy'
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
          default: 10000
      required:
        - namespace
        - name
        - description
        - input_schema
        - endpoint
        - http_method
    Tool:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        organisation_id:
          type: string
        product_id:
          type: string
        namespace:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        description:
          type: string
          minLength: 1
          maxLength: 500
        input_schema:
          $ref: '#/components/schemas/JSONSchema'
        output_schema:
          $ref: '#/components/schemas/JSONSchema'
        state:
          type: string
          enum:
            - draft
            - published
            - retired
        revision:
          type: integer
          format: int64
          minimum: 1
        endpoint:
          type: string
          format: uri
          maxLength: 8192
          readOnly: true
          description: Included only on the administrative editor representation of HTTP tools. It is credential-free and any legacy user information, query, or fragment is redacted.
        endpoint_requires_review:
          type: boolean
          readOnly: true
          description: Present and true only when unsafe legacy endpoint components were redacted or the stored endpoint could not be parsed.
        http_method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - MCP
            - NATIVE
        upstream_auth:
          $ref: '#/components/schemas/ToolUpstreamAuth'
        credential_present:
          type: boolean
          readOnly: true
          description: True when a purpose-bound encrypted upstream credential exists. The credential itself is never returned. False may be omitted.
        request_mapping:
          $ref: '#/components/schemas/ToolRequestMapping'
        response_mapping:
          $ref: '#/components/schemas/ToolResponseMapping'
        request_example:
          $ref: '#/components/schemas/ToolExample'
        response_example:
          $ref: '#/components/schemas/ToolExample'
        authorization_policy:
          $ref: '#/components/schemas/ToolAuthorizationPolicy'
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
        backend_kind:
          type: string
          enum:
            - http
            - mcp
            - native
        effect:
          type: string
          enum:
            - read
            - write
            - destructive
          description: First-class operation effect used by authorization and MCP annotations.
        idempotency_mode:
          type: string
          enum:
            - none
            - supported
            - required
        identity_requirement:
          type: string
          enum:
            - none
            - optional
            - actor_required
            - customer_required
            - actor_and_customer_required
            - installation_required
        state_scope:
          type: string
          enum:
            - none
            - plugin
            - actor
            - customer
            - installation
        max_concurrency:
          type: integer
          minimum: 0
          maximum: 64
        max_result_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1048576
        mcp_connection_id:
          type: string
        upstream_tool_name:
          type: string
        upstream_schema_hash:
          type: string
          description: SHA-256 pin of the imported upstream name and schemas.
        upstream_annotations:
          type: object
          additionalProperties: true
          description: Stored as untrusted metadata and never treated as local policy.
        upstream_drifted:
          type: boolean
          description: When true the tool is removed from discovery and execution fails closed.
        native_plugin_id:
          type: string
          description: Source-registered plugin identifier.
        native_tool_id:
          type: string
          description: Stable tool identifier inside the plugin manifest.
        native_plugin_version:
          type: string
          description: Exact source version pinned by this review revision.
        native_sdk_version:
          type: integer
          minimum: 1
        native_manifest_hash:
          type: string
          description: SHA-256 pin of the complete plugin manifest.
        native_contract_hash:
          type: string
          description: SHA-256 pin of this native tool contract.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - organisation_id
        - product_id
        - namespace
        - name
        - description
        - input_schema
