      responses:
        '201':
          description: Analysis ready for human review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationAnalysis'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/analyses/{analysis_id}:
