          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        description:
          type: string
          maxLength: 500
        http_method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        endpoint:
          type: string
          format: uri
          maxLength: 8192
          description: Fixed credential-free public HTTPS or local-development HTTP endpoint; user information, query strings, and fragments are removed during normalization.
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
          default: 10000
        input_schema:
          $ref: '#/components/schemas/JSONSchema'
        output_schema:
          $ref: '#/components/schemas/JSONSchema'
        upstream_auth:
          $ref: '#/components/schemas/ToolUpstreamAuth'
        request_mapping:
          $ref: '#/components/schemas/ToolRequestMapping'
        response_mapping:
          $ref: '#/components/schemas/ToolResponseMapping'
        authorization_policy:
          $ref: '#/components/schemas/ToolAuthorizationPolicy'
        request_example:
          type: object
          additionalProperties: true
          description: Optional non-secret object no larger than 64 KiB.
        response_example:
          type: object
          additionalProperties: true
          description: Optional non-secret object no larger than 64 KiB.
        credential_present:
          type: boolean
          readOnly: true
          description: Server-derived presence bit. This is not credential material and an inbound value is never trusted.
      required:
        - namespace
        - name
        - description
        - http_method
        - endpoint
        - timeout_ms
        - input_schema
        - output_schema
        - upstream_auth
        - request_mapping
        - response_mapping
        - authorization_policy
        - credential_present
