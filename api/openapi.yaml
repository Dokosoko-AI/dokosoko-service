                  description: Backwards-compatible singular bound. Use integration_ids.
                integration_ids:
                  type: array
                  minItems: 1
                  maxItems: 8
                  uniqueItems: true
                  description: Optional exact candidate API set. When omitted, the generator detects relevant APIs across the deployment.
                  items:
                    type: string
                    minLength: 1
              required:
                - prompt
      responses:
        '201':
          description: Generated recipe ready for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/recipes/{recipe_id}:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: ["Recipes and Analysis"]
      operationId: getRecipe
      responses:
        '200':
          description: Recipe plus complete immutable revision history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  recipe:
                    $ref: '#/components/schemas/Recipe'
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeRevision'
                required:
                  - recipe
                  - revisions
    patch:
      tags: ["Recipes and Analysis"]
      operationId: updateRecipeSpec
      description: >-
        Creates a human-reviewed immutable revision. The server owns the exact operation-derived instructions and derives Markdown;
        operators may change only reviewed reference_ids and visibility. Raw Markdown and instruction prose are never accepted.
        A recipe that invokes a product MCP tool must remain private because public MCP does not expose custom product tools.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecipeRequest'
      responses:
        '200':
          description: New review-state recipe revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags: ["Recipes and Analysis"]
      operationId: deleteRecipe
      description: >-
        Permanently deletes a legacy contract or an outdated recipe and its immutable revision history.
        Current product-integration recipes cannot be deleted. The deletion audit event is retained.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeDecisionRequest'
      responses:
        '204':
          description: Recipe and revision history deleted; deletion audit retained.
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
