              schema:
                $ref: '#/components/schemas/CustomerAccountList'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/customer-accounts/{customer_account_id}:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: customer_account_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateCustomerAccount
