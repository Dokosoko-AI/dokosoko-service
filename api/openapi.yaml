              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
                required:
                  - items
    post:
      operationId: createSource
      description: >-
        Creates a private, unpublished website, OpenAPI, or Git source. File uploads must use the reviewed multipart upload endpoint instead of supplying a client-selected storage
        location here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Source created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/sources/upload:
    parameters:
      - $ref: '#/components/parameters/ProductID'
    post:
      operationId: uploadSource
      description: >-
        Creates a private, unpublished upload source from one non-empty, valid UTF-8 documentation file. Accepted filename extensions are .md, .mdx, .txt, .html, .htm, .json,
        .yaml, and .yml. The configured DOKOSOKO_UPLOAD_MAX_BYTES limit is enforced while streaming. The file is stored under an opaque server-selected name and is never
        interpreted as a client-supplied filesystem path. Uploading does not automatically queue a crawl; an administrator must review the source and explicitly request ingestion.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                organisation_id:
                  type: string
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                file:
                  type: string
                  format: binary
                  description: Non-empty valid UTF-8 documentation file using one of the accepted extensions documented on this operation.
              required:
                - organisation_id
                - name
                - file
      responses:
        '201':
          description: Upload source created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/sources/{source_id}/crawl:
