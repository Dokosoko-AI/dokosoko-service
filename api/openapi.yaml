      additionalProperties: false
      properties:
        mode:
          type: string
        issuer:
          type: string
          format: uri
        audience:
          type: string
        grants:
          type: array
          items:
            type: string
        explanation:
          type: string
      required:
        - mode
        - explanation
    RecipeSeed:
      type: object
      additionalProperties: false
      description: One proposed coding-agent recipe for exactly one reviewed product capability.
      properties:
        slug:
          type: string
        title:
          type: string
        outcome:
          type: string
        audience:
          type: string
          enum:
            - coding_agent
            - developer
          description: Current product-integration candidates use coding_agent; developer is retained only for immutable legacy analysis snapshots.
        capability_ids:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          description: Exact reviewed product operation or API-contract evidence selected as the recipe's single capability.
          items:
            type: string
            minLength: 1
        sdk_id:
          type: string
          minLength: 1
          description: Optional exact reviewed SDK evidence used by the recipe.
        endpoint_ids:
          type: array
          deprecated: true
          description: Legacy analysis-snapshot field. Product-integration recipe v2 never populates or consumes it.
          items:
            type: string
        evidence_ids:
          type: array
          maxItems: 24
          uniqueItems: true
          description: Exact evidence resource IDs selected for this recipe. Omission is retained only for legacy records and is interpreted conservatively as the full analysis evidence snapshot.
          items:
            type: string
      required:
        - slug
        - title
        - outcome
        - audience
    IntegrationPlan:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
        identity:
          $ref: '#/components/schemas/IntegrationIdentityPlan'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationEndpointPlan'
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeSeed'
      required:
        - summary
        - identity
        - endpoints
        - recipes
    IntegrationAnalysis:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        organisation_id:
          type: string
        product_id:
          type: string
        schema_version:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
            - running
            - review
            - failed
        generated_by:
          type: string
          enum:
            - deterministic
            - ai_assisted
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationEvidence'
        plan:
          $ref: '#/components/schemas/IntegrationPlan'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationUnknown'
        error_code:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
      required:
        - id
        - organisation_id
        - product_id
        - schema_version
        - state
        - generated_by
        - evidence
        - plan
        - unknowns
        - revision
        - created_at
    IntegrationAnalysisList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationAnalysis'
      required:
        - items
    RecipeReference:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
        url:
          type: string
          format: uri
          description: HTTPS source URL already present in the analysis evidence manifest.
        kind:
          type: string
        resource_id:
          type: string
        anchor:
          type: string
      required:
        - label
        - url
        - kind
    RecipeDependency:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        resource_id:
          type: string
        version:
          type: string
          description: Opaque evidence fingerprint captured when this recipe revision was generated.
      required:
        - kind
        - resource_id
        - version
    RecipeValidationFinding:
      type: object
      additionalProperties: false
      properties:
        level:
          type: string
          enum:
            - info
            - warning
            - error
        code:
          type: string
        message:
          type: string
        evidence:
          type: array
          description: Exact immutable product evidence selected by a server-owned advisory finding.
          items:
            $ref: '#/components/schemas/RecipeEvidenceRef'
      required:
        - level
        - code
        - message
    RecipeEvidenceRef:
      type: object
      additionalProperties: false
      description: Exact immutable evidence fact supporting one recipe instruction.
      properties:
        kind:
          type: string
          minLength: 1
        resource_id:
          type: string
          minLength: 1
        fingerprint:
          type: string
          minLength: 1
      required:
        - kind
        - resource_id
        - fingerprint
    RecipeInstruction:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 500
        expected_result:
          type: string
          maxLength: 500
        evidence:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecipeEvidenceRef'
      required:
        - action
        - evidence
    RecipeResultInstruction:
      type: object
      additionalProperties: false
      description: Evidence-bound implementation or verification instruction with an observable expected result.
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 500
        expected_result:
          type: string
          minLength: 1
          maxLength: 500
        evidence:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecipeEvidenceRef'
      required:
        - action
        - expected_result
        - evidence
    LegacyRecipeSpec:
      type: object
      additionalProperties: false
      maxProperties: 0
      deprecated: true
      description: Empty placeholder retained only for immutable legacy-mcp-v1 revision history.
    RecipeSpec:
      type: object
      additionalProperties: false
      description: >-
        Canonical structured source for an already-connected coding agent. Version 2 retains one historical API owner; version 3 is deployment-owned and attaches one or more APIs. The server derives all instruction prose from exact reviewed operation facts.
      oneOf:
        - title: Product-integration v2 spec
          properties:
            schema_version:
              const: 2
          required:
            - integration_id
        - title: Deployment recipe v3 spec
          properties:
            schema_version:
              const: 3
          required:
            - api_attachments
      properties:
        schema_version:
          type: integer
          enum: [2, 3]
        integration_id:
          type: string
          minLength: 1
          description: Historical singular owner for product-integration-v2 only.
        api_attachments:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecipeAPIAttachment'
        title:
          type: string
          minLength: 1
        outcome:
          type: string
          minLength: 1
        sdk_id:
          type: string
          minLength: 1
        capability_ids:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            minLength: 1
        prerequisites:
          type:
            - array
            - 'null'
          maxItems: 4
          description: Zero to four prerequisites. Historical and deterministic no-prerequisite revisions may encode this as null.
          readOnly: true
          items:
            $ref: '#/components/schemas/RecipeInstruction'
        steps:
          type: array
          readOnly: true
          minItems: 2
          maxItems: 8
          items:
            $ref: '#/components/schemas/RecipeResultInstruction'
        checks:
          type: array
          readOnly: true
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/RecipeResultInstruction'
        reference_ids:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Exact reviewed product-document IDs selected for the server-rendered reference list.
          items:
            type: string
            minLength: 1
      required:
        - schema_version
        - title
        - outcome
        - capability_ids
        - prerequisites
        - steps
        - checks
    RecipeAPIAttachment:
      type: object
      additionalProperties: false
      properties:
        integration_id:
          type: string
          minLength: 1
      required:
        - integration_id
    RecipeAPIBinding:
      type: object
      additionalProperties: false
      description: Exact immutable API publication frozen into one recipe revision.
      properties:
        integration_id:
          type: string
          minLength: 1
        integration_revision_id:
          type: string
          minLength: 1
        integration_manifest_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      required:
        - integration_id
        - integration_revision_id
        - integration_manifest_hash
    RecipeRevision:
      type: object
      additionalProperties: false
      description: Immutable structured recipe revision with its canonical rendering and exact integration and prompt provenance.
      oneOf:
        - title: Legacy recipe revision
          properties:
            spec_version:
              const: 1
            spec:
              $ref: '#/components/schemas/LegacyRecipeSpec'
          required:
            - spec_version
            - spec
        - title: Human or deterministic product-integration revision
          properties:
            spec_version:
              const: 2
            spec:
              $ref: '#/components/schemas/RecipeSpec'
            generated_by:
              type: string
              enum:
                - human
                - deterministic
          required:
            - spec_version
            - spec
            - generated_by
            - integration_revision_id
            - integration_manifest_hash
        - title: AI-assisted product-integration revision
          properties:
            spec_version:
              const: 2
            spec:
              $ref: '#/components/schemas/RecipeSpec'
            generated_by:
              const: ai
          required:
            - spec_version
            - spec
            - generated_by
            - model
            - integration_revision_id
            - integration_manifest_hash
            - prompt_version
            - prompt_hash
        - title: Human or deterministic deployment recipe revision
          properties:
            spec_version:
              const: 3
            spec:
              $ref: '#/components/schemas/RecipeSpec'
            generated_by:
              type: string
              enum:
                - human
                - deterministic
          required:
            - spec_version
            - spec
            - generated_by
            - api_bindings
        - title: AI-assisted deployment recipe revision
          properties:
            spec_version:
              const: 3
            spec:
              $ref: '#/components/schemas/RecipeSpec'
            generated_by:
              const: ai
          required:
            - spec_version
            - spec
            - generated_by
            - model
            - api_bindings
            - prompt_version
            - prompt_hash
      properties:
        id:
          type: string
        recipe_id:
          type: string
        revision:
          type: integer
          minimum: 1
        spec_version:
          type: integer
          enum:
            - 1
            - 2
            - 3
          description: Version 1 is legacy history, version 2 is singular product-integration history, and version 3 is a deployment recipe with API attachments.
        spec:
          oneOf:
            - $ref: '#/components/schemas/LegacyRecipeSpec'
            - $ref: '#/components/schemas/RecipeSpec'
        markdown:
          type: string
          readOnly: true
          description: Canonical server rendering of spec for MCP resource delivery. This field is never accepted as an authoring source.
        references:
          type:
            - array
            - 'null'
          readOnly: true
          description: Canonical references selected by spec.reference_ids from the reviewed product evidence; null means no reference list.
          items:
            $ref: '#/components/schemas/RecipeReference'
        validation:
          type: array
          items:
            $ref: '#/components/schemas/RecipeValidationFinding'
        review:
          type: string
        generated_by:
          type: string
          enum:
            - ai
            - human
            - deterministic
        model:
          type: string
        integration_revision_id:
          type: string
          minLength: 1
          description: Exact published Integration revision against which this recipe revision was validated.
        integration_manifest_hash:
          type: string
          minLength: 1
          description: Immutable manifest fingerprint of the bound Integration revision.
        api_bindings:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecipeAPIBinding'
        prompt_version:
          type: string
          minLength: 1
          description: Effective authoring prompt version for an AI-generated revision; omitted for human and deterministic revisions.
        prompt_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: SHA-256 digest of the effective authoring prompt for an AI-generated revision.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - recipe_id
        - revision
        - spec_version
        - spec
        - markdown
        - references
        - validation
        - generated_by
        - created_by
        - created_at
    Recipe:
      type: object
      additionalProperties: false
      description: Administrable deployment-level recipe. New records use deployment-recipe-v3 and attach every API used by the current revision.
      oneOf:
        - title: Immutable legacy recipe history
          properties:
            contract_version:
              const: legacy-mcp-v1
          required:
            - contract_version
        - title: Product-integration recipe
          properties:
            contract_version:
              const: product-integration-v2
            integration_id:
              type: string
              minLength: 1
          required:
            - contract_version
            - integration_id
        - title: Deployment recipe
          properties:
            contract_version:
              const: deployment-recipe-v3
            api_attachments:
              type: array
              minItems: 1
              maxItems: 8
          required:
            - contract_version
            - api_attachments
      properties:
        id:
          type: string
        organisation_id:
          type: string
        product_id:
          type: string
        integration_id:
          type: string
          description: Exact Integration scope for product-integration-v2 recipes.
        api_attachments:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Current applicability edges from this deployment-owned recipe to its APIs.
          items:
            $ref: '#/components/schemas/RecipeAPIAttachment'
        analysis_id:
          type: string
        contract_version:
          type: string
          enum:
            - legacy-mcp-v1
            - product-integration-v2
            - deployment-recipe-v3
        slug:
          type: string
        title:
          type: string
        outcome:
          type: string
        audience:
          type: string
        state:
          type: string
          enum:
            - draft
            - review
            - approved
            - published
            - outdated
        generated:
          type: boolean
        needs_attention:
          type: boolean
        visibility:
          $ref: '#/components/schemas/Visibility'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/RecipeDependency'
        current_revision_id:
          type: string
        current_revision:
          $ref: '#/components/schemas/RecipeRevision'
        stable_uri:
          type: string
          pattern: ^dokosoko://products/[^/]+/recipes/[^/]+$
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - organisation_id
        - product_id
        - contract_version
        - slug
        - title
        - outcome
        - audience
        - state
        - generated
        - needs_attention
        - visibility
        - dependencies
        - current_revision_id
        - stable_uri
        - revision
        - created_at
        - updated_at
    RecipeList:
      type: object
