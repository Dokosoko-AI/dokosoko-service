  /oauth/register:
    post:
      tags: ["MCP"]
      security: []
      operationId: registerOAuthClient
      description: >-
        Registers a public PKCE client under RFC 7591. Identical normalized metadata returns the same durable client identifier, making network retries safe. No client secret is
        issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientRegistrationRequest'
      responses:
        '201':
          description: Idempotent public-client registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientRegistration'
        '400':
          $ref: '#/components/responses/OAuthError'
        '404':
          $ref: '#/components/responses/OAuthError'
        '429':
          $ref: '#/components/responses/OAuthRateLimit'
        '503':
          $ref: '#/components/responses/OAuthError'
  /oauth/authorize:
    get:
      tags: ["MCP"]
      security: []
      operationId: oauthAuthorize
      description: >-
        Starts authorization-code OAuth using a registered public client or HTTPS client metadata document, mandatory RFC 8707 resource binding, PKCE S256, upstream vendor OIDC,
        and fail-closed access evaluation.
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            const: code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            description: Durable RFC 7591 client identifier or HTTPS URL of a client metadata document.
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: resource
          in: query
          required: true
          schema:
            type: string
            format: uri
            description: Exact Private MCP resource URL advertised by protected-resource metadata.
        - name: scope
          in: query
          required: false
          schema:
            type: string
            default: mcp:private
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            const: S256
      responses:
        '302':
          description: Redirect to the configured vendor IdP.
        '400':
          $ref: '#/components/responses/OAuthError'
  /oauth/callback:
    get:
      tags: ["MCP"]
      security: []
      operationId: oauthCallback
      description: >-
        For public OAuth states, verifies upstream state, nonce and ID token, resolves vendor access fail-closed, creates or resolves the durable customer account, then redirects
        with a one-time code. Prefixed administration-test states stop after OIDC, audience/client, nonce, issuer, and customer-claim verification and redirect to the fixed
        same-origin Identity page without retaining tokens or creating runtime identity data.
      responses:
        '302':
          description: Exact registered client redirect.
        '303':
          description: >-
            Fixed same-origin Identity-page redirect carrying identity_test_id for a stored result or
            identity_test_error=invalid_or_expired when the callback transaction cannot be claimed.
        '401':
          $ref: '#/components/responses/OAuthError'
  /oauth/token:
    post:
      tags: ["MCP"]
      security: []
      operationId: oauthToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                grant_type:
                  const: authorization_code
                code:
                  type: string
                code_verifier:
                  type: string
                client_id:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                resource:
                  type: string
                  format: uri
              required:
                - grant_type
                - code
                - code_verifier
                - client_id
                - redirect_uri
                - resource
      responses:
        '200':
          description: Short-lived opaque DokoSoko access token bound to the exact Private MCP resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          $ref: '#/components/responses/OAuthError'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
