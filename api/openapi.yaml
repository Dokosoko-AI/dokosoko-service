      additionalProperties: false
      description: One caller-supplied untrusted, non-secret contextual message. It cannot authorize any action and is never persisted by this endpoint.
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            At most 2,048 UTF-8 bytes after trimming. Credential-like material, destination URLs, nonce-shaped
