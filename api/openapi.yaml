          minLength: 1
          maxLength: 80
        code:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 500
        instance_path:
          type: string
          maxLength: 500
          description: Value-free JSON instance location.
        schema_path:
          type: string
          maxLength: 500
      required:
        - phase
        - code
        - message
    ToolTestRun:
      type: object
      additionalProperties: false
      description: >-
        Sanitized, append-only evidence retained for at most 24 hours. Shape object keys are limited to schema-declared property names; undeclared upstream keys are replaced with
        positional placeholders, and diagnostic paths redact undeclared property names. Actor/request IDs and argument hashes remain server-private; destinations, headers, bodies,
        scalar values, credentials, nonce material, and idempotency keys are never stored in this representation.
      properties:
        id:
          type: string
        organisation_id:
          type: string
        product_id:
          type: string
        tool_id:
          type: string
        tool_revision:
          type: integer
          format: int64
          minimum: 1
        tool_name:
          type: string
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        authentication_type:
          type: string
          enum:
            - delegated_oauth
            - none
            - bearer
            - authorization_scheme
            - api_key_header
            - api_key_query
            - basic
            - oauth_client_credentials
            - custom_header
          description: delegated_oauth is retained only on a controlled authorization-unavailable failure with no upstream network call.
        outcome:
          type: string
          enum:
            - success
            - failure
        phase:
          type: string
        network_call_performed:
          type: boolean
        upstream_status_code:
          type: integer
          minimum: 100
          maximum: 599
        response_bytes:
          type: integer
          format: int64
          minimum: 0
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        request_shape:
          $ref: '#/components/schemas/ToolTestJSONShape'
        response_shape:
          $ref: '#/components/schemas/ToolTestJSONShape'
        findings:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/ToolTestFinding'
        evidence_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          readOnly: true
          description: Server-computed browser/server consent binding over this exact run. It is required by the analysis request but never sent to the configured provider.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - organisation_id
        - product_id
        - tool_id
        - tool_revision
        - tool_name
        - method
        - authentication_type
        - outcome
        - phase
        - network_call_performed
        - duration_ms
        - request_shape
        - findings
        - evidence_hash
        - expires_at
        - created_at
    ToolTestRunList:
