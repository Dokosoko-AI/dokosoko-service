            Required for an HTTP-backed tool. Public destinations use credential-free HTTPS on the default port. Local development destinations use HTTP on localhost, a localhost
            subdomain, 127.0.0.1, or ::1 and may use a local port. Query strings and fragments are forbidden. delegated_oauth additionally requires the configured authorization API
            origin. Ignored for managed MCP-backed tools.
        http_method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          description: Required for an HTTP-backed tool and restricted to these five methods. Managed MCP-backed tools retain their MCP method and ignore this request value.
        upstream_auth:
          $ref: '#/components/schemas/ToolUpstreamAuth'
        credential:
          $ref: '#/components/schemas/ToolCredential'
        request_mapping:
          $ref: '#/components/schemas/ToolRequestMapping'
        response_mapping:
          $ref: '#/components/schemas/ToolResponseMapping'
        request_example:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Supply null to clear the current request example.
        response_example:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Supply null to clear the current response example.
        authorization_policy:
          $ref: '#/components/schemas/ToolAuthorizationPolicy'
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
          default: 10000
        revision:
          type: integer
          format: int64
          minimum: 1
      required:
        - description
        - input_schema
        - output_schema
        - authorization_policy
        - timeout_ms
        - revision
    CloneToolRequest:
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: New immutable namespace identity.
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: New immutable tool-name identity.
        credential:
          $ref: '#/components/schemas/ToolCredential'
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Exact source-tool revision that was reviewed. A stale revision is rejected before any credential is stored.
      required:
        - namespace
        - name
        - revision
    ToolDraft:
      type: object
      additionalProperties: false
      description: >-
        Canonical non-secret HTTP tool candidate shared by manual, import, proposal, and analysis flows. Inbound credential_present is ignored and normalized from server-side state
        or explicit save intent.
      properties:
        namespace:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        description:
          type: string
          maxLength: 500
        http_method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        endpoint:
          type: string
          format: uri
          maxLength: 8192
          description: Fixed credential-free public HTTPS or local-development HTTP endpoint; user information, query strings, and fragments are removed during normalization.
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
          default: 10000
        input_schema:
          $ref: '#/components/schemas/JSONSchema'
        output_schema:
          $ref: '#/components/schemas/JSONSchema'
        upstream_auth:
          $ref: '#/components/schemas/ToolUpstreamAuth'
        request_mapping:
          $ref: '#/components/schemas/ToolRequestMapping'
        response_mapping:
          $ref: '#/components/schemas/ToolResponseMapping'
        authorization_policy:
          $ref: '#/components/schemas/ToolAuthorizationPolicy'
        request_example:
          type: object
          additionalProperties: true
          description: Optional non-secret object no larger than 64 KiB.
        response_example:
          type: object
          additionalProperties: true
          description: Optional non-secret object no larger than 64 KiB.
        credential_present:
          type: boolean
          readOnly: true
          description: Server-derived presence bit. This is not credential material and an inbound value is never trusted.
      required:
        - namespace
        - name
        - description
        - http_method
        - endpoint
        - timeout_ms
        - input_schema
        - output_schema
        - upstream_auth
        - request_mapping
        - response_mapping
        - authorization_policy
        - credential_present
    ToolDraftContext:
