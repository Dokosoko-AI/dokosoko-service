    CredentialFreeHTTPSOrLocalhostHTTPURI:
      type: string
      format: uri
      maxLength: 2048
      pattern: ^(?:https://[^/?#@]+|http://(?:(?:[A-Za-z0-9-]+\.)*[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127\.0\.0\.1|\[::1\])(?::[0-9]{1,5})?)(?:/[^?#]*)?$
      description: >-
        HTTPS URI without userinfo, a query, or a fragment. HTTP is accepted only for localhost, localhost subdomains, 127.0.0.1, or ::1 local-development hosts. These common
        credential channels are rejected, but the path is not secret-scanned and must not contain credentials.
    RuntimeOutboundURI:
      type: string
      format: uri
      maxLength: 2048
      pattern: ^(?:https://[^/?#@:]+(?::443)?|http://(?:(?:[A-Za-z0-9-]+\.)*[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127\.0\.0\.1|\[::1\])(?::[0-9]{1,5})?)(?:/[^?#]*)?$
      description: >-
        Credential-free outbound destination without a query or fragment. Remote destinations require HTTPS on the default port; HTTP is accepted only for explicitly allowed
        local-development hosts.
    OptionalRuntimeOutboundURI:
      type: string
      maxLength: 2048
      pattern: ^$|^(?:https://[^/?#@:]+(?::443)?|http://(?:(?:[A-Za-z0-9-]+\.)*[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127\.0\.0\.1|\[::1\])(?::[0-9]{1,5})?)(?:/[^?#]*)?$
      description: Empty disables delivery; non-empty values follow the runtime outbound URI policy.
    RuntimeAuthenticationType:
      type: string
      enum:
        - none
        - delegated_oauth
        - bearer
        - authorization_scheme
        - api_key_header
        - api_key_query
        - basic
        - oauth_client_credentials
        - custom_header
      description: Vendor-neutral upstream authentication mode for one service-connection revision.
    RuntimeCredentialAuthenticationType:
      type: string
      enum:
        - bearer
        - authorization_scheme
        - api_key_header
        - api_key_query
        - basic
        - oauth_client_credentials
        - custom_header
      description: Upstream authentication mode that requires an encrypted runtime credential set.
    RuntimeAuthenticationConfiguration:
      type: object
      additionalProperties: false
      description: >-
        Non-secret structural authentication settings. Only fields applicable to the selected authentication type are accepted; credential values belong exclusively in write-only
        request fields.
      properties:
        scheme:
          type: string
          minLength: 1
          maxLength: 120
        query_name:
          type: string
          minLength: 1
          maxLength: 120
        username:
          type: string
          minLength: 1
          maxLength: 500
        client_id:
          type: string
          minLength: 1
          maxLength: 500
        token_url:
          $ref: '#/components/schemas/RuntimeOutboundURI'
        token_endpoint_auth_method:
          type: string
          enum:
            - client_secret_basic
            - client_secret_post
        scopes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
          maxItems: 100
          uniqueItems: true
        audience:
          type: string
          minLength: 1
          maxLength: 1000
        resource:
          type: string
          minLength: 1
          maxLength: 1000
        prefix:
          type: string
          maxLength: 120
        headers:
          type: array
          description: Ordered names of additional encrypted Authorization headers. Values are never returned.
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
    RuntimeAuthorizationHeaderInput:
      type: object
      additionalProperties: false
      description: Write-only value for one additional fixed Authorization header.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type: string
          format: password
          maxLength: 16384
          writeOnly: true
          description: Required when creating or adding a header. Leave blank on update to preserve the stored value for the same name.
      required:
        - name
        - value
    RuntimeServiceConnectionRevision:
      type: object
      additionalProperties: false
      description: Immutable, environment-specific runtime destination and authentication configuration. It references credential metadata by ID and contains no credential or vault material.
      properties:
        id:
          type: string
        connection_id:
          type: string
        environment_id:
          type: string
        base_url:
          $ref: '#/components/schemas/RuntimeOutboundURI'
        authentication_type:
          $ref: '#/components/schemas/RuntimeAuthenticationType'
        authorization_id:
          type: string
        auth_config:
          $ref: '#/components/schemas/RuntimeAuthenticationConfiguration'
        content_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        revision:
          type: integer
          format: int64
          minimum: 1
        current:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - connection_id
        - environment_id
        - base_url
        - authentication_type
        - auth_config
        - content_hash
        - revision
        - current
        - created_at
    RuntimeServiceConnection:
