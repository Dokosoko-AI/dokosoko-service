        activated_at:
          type: string
          format: date-time
        retires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - authorization_id
        - fingerprint
        - state
        - created_at
    RuntimeCredentialSet:
      type: object
      additionalProperties: false
      description: Stable, reusable, credential-redacted Authorization metadata.
      properties:
        id:
          type: string
        deployment_id:
          type: string
        organisation_id:
          type: string
        environment_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        environment_variable:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,127}$
        authentication_type:
          $ref: '#/components/schemas/RuntimeCredentialAuthenticationType'
        header_name:
          type: string
          maxLength: 120
        auth_config:
          $ref: '#/components/schemas/RuntimeAuthenticationConfiguration'
        key_management_url:
          $ref: '#/components/schemas/CredentialFreeHTTPSOrLocalhostHTTPURI'
          description: Operator-facing credential-management URL. DokoSoko stores this as metadata and never fetches it.
        access_evaluation_url:
          $ref: '#/components/schemas/RuntimeOutboundURI'
          description: Synchronous fail-closed access decision hook owned by this Authorization.
        usage_url:
          $ref: '#/components/schemas/RuntimeOutboundURI'
          description: Asynchronous usage event hook owned by this Authorization.
        state:
          type: string
          enum:
            - active
            - disabled
        credential_present:
          type: boolean
        active_fingerprint:
          type: string
          pattern: ^[0-9a-f]{16}$
        revision:
          type: integer
          format: int64
          minimum: 1
        versions:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeCredentialVersion'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - deployment_id
        - organisation_id
        - environment_id
        - name
        - environment_variable
        - authentication_type
        - auth_config
        - access_evaluation_url
        - usage_url
        - state
        - credential_present
        - revision
        - created_at
        - updated_at
    RuntimeAuthorizationProfileList:
      type: object
