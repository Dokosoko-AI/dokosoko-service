    patch:
      operationId: changeAPIContractBinding
      tags: ["API Resources"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIContractBindingInput'
      responses:
        '200':
          description: Revised contract attachment.
          content:
            application/json:
