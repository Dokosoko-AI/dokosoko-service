openapi: 3.1.0
info:
  title: DokoSoko Control Plane API
  version: 4.0.0
  description: >-
    Control-plane contract for DokoSoko's core documentation, SDK references, credentials, recipes, reviewed tools, native tools, and MCP connector. Cookie-authenticated mutations
    also require CSRF validation. Public MCP is optional and read-only.
servers:
  - url: https://dokosoko.example.com
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Service is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                  - status
  /readyz:
    get:
      security: []
      operationId: readiness
      responses:
        '200':
          description: Persistence is reachable and migrations are applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/deployment:
    get:
      operationId: getDeployment
      responses:
        '200':
          description: Singleton DokoSoko deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
    post:
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentInput'
      responses:
        '201':
          description: Deployment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '409':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentInput'
      responses:
        '200':
          description: Deployment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/native-plugins:
    get:
      operationId: listNativePlugins
      description: Lists source-registered native plugin lifecycle, declared capabilities, tool contracts, and configuration key status. Configuration values are never returned.
      responses:
        '200':
          description: Native plugin status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativePluginList'
  /api/v1/native-plugins/{plugin_id}/state:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
    patch:
      operationId: updateNativePluginState
      description: Enables or disables a source-registered plugin. Environment-disabled plugins cannot be enabled through the API. The change is audit logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
      responses:
        '200':
          description: Updated native plugin status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativePlugin'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/environments:
    get:
      operationId: listDeploymentEnvironments
      responses:
        '200':
          description: Deployment environments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentList'
    post:
      operationId: createDeploymentEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organisation_id:
                  type: string
                name:
                  type: string
                slug:
                  type: string
                is_production:
                  type: boolean
              required:
                - organisation_id
                - name
                - slug
      responses:
        '201':
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
  /api/v1/integrations:
    get:
      operationId: listIntegrations
      responses:
        '200':
          description: Versioned API Integrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationList'
    post:
      operationId: createIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
      responses:
        '201':
          description: Integration created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getIntegration
      responses:
        '200':
          description: Integration, immutable revision history, and current publish readiness/diff.
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration:
                    $ref: '#/components/schemas/Integration'
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntegrationRevision'
                  publish_status:
                    $ref: '#/components/schemas/IntegrationPublishStatus'
                required:
                  - integration
                  - revisions
                  - publish_status
    put:
      operationId: replaceIntegration
      description: >-
        Replaces the complete mutable Integration representation. Changing visibility from private to public requires acknowledge_public=true, and the change does not appear
        publicly until the resulting Integration snapshot is published.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceIntegrationRequest'
      responses:
        '200':
          description: Integration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/publish:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: publishIntegration
      description: >-
        Publishes only the exact server-preflight candidate identified by its optimistic Integration revision and manifest hash. A changed candidate is rejected and must be
        preflighted again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishIntegrationRequest'
      responses:
        '201':
          description: Immutable Integration revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationRevision'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/preflight:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: preflightIntegration
      description: Rebuilds and validates the exact API candidate. Required documentation, contracts, SDK references, identity, authorization, tool, and runtime-service gates fail closed.
      responses:
        '200':
          description: Server-backed candidate preflight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationPreflight'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/runtime-setup:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getIntegrationRuntimeSetup
      description: >-
        Returns the shortest-path runtime Access setup for one API, including environments, service connections, and credential metadata. Credential values and internal vault
        identifiers are never returned.
      responses:
        '200':
          description: Runtime Access setup with credential-redacted metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSetup'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: configureIntegrationRuntimeSetup
      description: >-
        Configures one environment-specific service connection and either selects an existing eligible credential set or creates a dedicated/shared credential set in the same
        shortest-path request. Credential input is write-only and is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeSetupRequest'
      responses:
        '200':
          description: Updated runtime Access setup with credential-redacted metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSetup'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/runtime-connections:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listIntegrationRuntimeServiceConnections
      description: Lists the API-owned upstream service connections and their current immutable environment revisions.
      responses:
        '200':
          description: Runtime service connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeServiceConnectionList'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createIntegrationRuntimeServiceConnection
      description: >-
        Creates or revises a named API-owned service connection. The destination is a credential-free HTTPS origin or localhost HTTP origin; secret material is referenced only
        through an eligible credential-set identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeServiceConnectionRequest'
      responses:
        '201':
          description: Created or revised runtime service connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeServiceConnection'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/runtime-service-connections/{connection_id}/check:
    parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: checkRuntimeServiceConnection
      description: Performs a deterministic, value-free configuration check for one API-owned service connection. This does not send an unspecified network probe to the upstream service.
      responses:
        '200':
          description: Credential-redacted service-connection readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeServiceConnectionReadiness'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/runtime-credential-sets:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createIntegrationRuntimeCredentialSet
      description: >-
        Creates an encrypted dedicated or deliberately shared runtime credential set. The credential is accepted only through the write-only request field; responses expose
        lifecycle and fingerprint metadata only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCredentialSetRequest'
      responses:
        '201':
          description: Credential-redacted runtime credential set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCredentialSet'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/runtime-credential-sets/{credential_set_id}:
    parameters:
      - name: credential_set_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRuntimeCredentialSet
      description: Returns lifecycle, scope, usage-safe fingerprint, and version metadata for one credential set. Credential values and internal vault identifiers are never returned.
      responses:
        '200':
          description: Credential-redacted runtime credential set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCredentialSet'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/runtime-credential-sets/{credential_set_id}/usage:
    parameters:
      - name: credential_set_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRuntimeCredentialUsage
      description: Lists every service connection in the deployment whose current environment revision references this credential set.
      responses:
        '200':
          description: Credential-set usage by runtime service connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCredentialUsage'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/runtime-credential-sets/{credential_set_id}/rotate:
    parameters:
      - name: credential_set_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rotateRuntimeCredential
      description: Stores and activates a new encrypted credential version while moving the prior active version into retiring state. The credential is write-only and is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateRuntimeCredentialRequest'
      responses:
        '200':
          description: Credential-redacted runtime credential set after rotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCredentialSet'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/runtime-credential-sets/{credential_set_id}/versions/{version_id}/revoke:
    parameters:
      - name: credential_set_id
        in: path
        required: true
        schema:
          type: string
      - name: version_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: revokeRuntimeCredentialVersion
      description: Revokes one exact credential version and returns only the credential set's updated redacted metadata. Repeating a completed revoke is idempotent.
      responses:
        '200':
          description: Credential-redacted runtime credential set after revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCredentialSet'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/authorization-points:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listIntegrationAuthorizationPoints
      description: Lists declarative authorization points for one Integration. Authorization points contain no arbitrary callback URL or credential.
      responses:
        '200':
          description: Integration authorization points.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationPointList'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createIntegrationAuthorizationPoint
      description: Creates a declarative action-to-grants policy. Every required grant must already be active in the deployment grant registry, and destructive actions require confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorizationPointRequest'
      responses:
        '201':
          description: Authorization point created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationPoint'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/authorization-points/{authorization_point_id}:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
      - name: authorization_point_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateIntegrationAuthorizationPoint
      description: Replaces mutable policy fields using optimistic revision control. The stable authorization-point key cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthorizationPointRequest'
      responses:
        '200':
          description: Authorization point updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationPoint'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/tools:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listIntegrationToolBindings
      description: Lists reusable tools bound to this Integration at exact published tool and authorization-point revisions.
      responses:
        '200':
          description: Exact Integration tool bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationToolBindingList'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: setIntegrationToolBindings
      description: >-
        Atomically replaces the complete tool-binding set. Every selection must name the tool's current exact published revision and one exact active authorization-point revision
        owned by the same Integration; an empty array clears all bindings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetIntegrationToolBindingsRequest'
      responses:
        '200':
          description: Exact Integration tool bindings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationToolBindingList'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/resource-sets:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: attachIntegrationResourceSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resource_set_id:
                  type: string
                pinned_revision_id:
                  type: string
              required:
                - resource_set_id
      responses:
        '200':
          description: Explicit Integration resource link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResourceLink'
  /api/v1/integrations/{integration_id}/resource-sets/{resource_set_id}:
    parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
      - name: resource_set_id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: detachIntegrationResourceSet
      responses:
        '204':
          description: Resource set detached.
  /api/v1/resource-sets:
    get:
      operationId: listResourceSets
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - documentation
              - api
      responses:
        '200':
          description: Reusable resource sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSetList'
    post:
      operationId: createResourceSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceSetInput'
      responses:
        '201':
          description: Resource set and first revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSet'
  /api/v1/grant-definitions:
    get:
      operationId: listGrantDefinitions
      description: Lists the deployment-owned authorization vocabulary. A grant definition describes a key and never grants access by itself.
      responses:
        '200':
          description: Registered grant definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDefinitionList'
    post:
      operationId: createGrantDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantDefinitionRequest'
      responses:
        '201':
          description: Grant definition registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDefinition'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/grant-definitions/{grant_id}:
    parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateGrantDefinition
      description: Replaces mutable grant metadata using optimistic revision control. The stable grant key cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGrantDefinitionRequest'
      responses:
        '200':
          description: Grant definition updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDefinition'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/resource-sets/{resource_set_id}:
    parameters:
      - name: resource_set_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getResourceSet
      responses:
        '200':
          description: Resource set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSet'
    patch:
      operationId: updateResourceSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceSetInput'
      responses:
        '200':
          description: Resource set with a new immutable content revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSet'
  /api/v1/resource-sets/{resource_set_id}/duplicate:
    parameters:
      - name: resource_set_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: duplicateResourceSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        '201':
          description: Independent resource-set copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSet'
  /api/v1/setup/status:
    get:
      security: []
      operationId: setupStatus
      responses:
        '200':
          description: First-run setup state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_complete:
                    type: boolean
                  requires_mfa:
                    const: true
                required:
                  - setup_complete
                  - requires_mfa
  /api/v1/setup/begin:
    post:
      security:
        - setupToken: []
      operationId: beginSetup
      requestBody:
        $ref: '#/components/requestBodies/RootInput'
      responses:
        '201':
          $ref: '#/components/responses/MFAEnrollment'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/setup/complete:
    post:
      security: []
      operationId: completeSetup
      requestBody:
        $ref: '#/components/requestBodies/MFACompletion'
      responses:
        '201':
          $ref: '#/components/responses/AuthenticatedRoot'
  /api/v1/auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                code:
                  type: string
                  description: TOTP or unused recovery code.
              required:
                - email
                - password
                - code
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedRoot'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Session ended and cookies expired.
  /api/v1/auth/session:
    get:
      operationId: currentSession
      responses:
        '200':
          description: Current root session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/RootUser'
                  expires_at:
