      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                state:
                  type: string
                  enum:
                    - active
                    - suspended
                revision:
                  type: integer
                  format: int64
                  minimum: 1
              required:
                - state
                - revision
      responses:
        '200':
          description: Updated customer account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/environments:
