                idempotency_key:
                  type: string
                  minLength: 16
                  maxLength: 200
                  pattern: ^[!-~]{16,200}$
                  description: >-
                    Stable identifier for one tool invocation. Required for custom HTTP mutations whose discovery metadata declares com.dokosoko/idempotencyKeyRequired. Reuse it
                    across transport retries; do not substitute a request ID.
