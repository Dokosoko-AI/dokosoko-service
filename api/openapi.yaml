            schema:
              $ref: '#/components/schemas/UpdateRecipeRequest'
      responses:
        '200':
          description: New review-state recipe revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/recipes/{recipe_id}/rework:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: reworkRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                instruction:
                  type: string
                  minLength: 1
                  maxLength: 8000
              required:
                - instruction
      responses:
        '200':
          description: New generated revision ready for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/recipes/{recipe_id}/approve:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: approveRecipe
      description: Records explicit human approval of the current revision. Validation errors fail closed.
      responses:
        '200':
          description: Approved recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/recipes/{recipe_id}/publish:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: publishRecipe
      description: Publishes only the approved current revision. Public recipes may reference only public, published, non-quarantined sources.
      responses:
        '200':
          description: Recipe available as a stable MCP resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/attention:
    parameters:
      - $ref: '#/components/parameters/ProductID'
    get:
      operationId: getRecipeAttention
      deprecated: true
      description: Removed. Read recipe needs_attention state directly and resolve read-only analysis unknowns by changing evidence or configuration.
      responses:
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/ai-usage:
    parameters:
      - $ref: '#/components/parameters/ProductID'
    get:
      operationId: getAIUsage
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Provider operations, normalized failures, token counts, and latency by workload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIUsage'
  /.well-known/oauth-authorization-server:
    get:
      security: []
      operationId: getOAuthAuthorizationServerMetadata
      description: RFC 8414-compatible authorization-server metadata for resource-bound Private MCP OAuth.
      responses:
        '200':
          description: Authorization-server metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationServerMetadata'
  /.well-known/oauth-protected-resource/mcp:
    get:
      security: []
      operationId: getMCPProtectedResourceMetadata
      description: RFC 9728 protected-resource metadata for the singleton Deployment's Private MCP endpoint.
      responses:
        '200':
          description: Protected-resource metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProtectedResourceMetadata'
        '404':
          $ref: '#/components/responses/Error'
  /oauth/register:
    post:
      security: []
      operationId: registerOAuthClient
      description: >-
        Registers a public PKCE client under RFC 7591. Identical normalized metadata returns the same durable client identifier, making network retries safe. No client secret is
        issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientRegistrationRequest'
      responses:
        '201':
          description: Idempotent public-client registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientRegistration'
        '400':
          $ref: '#/components/responses/OAuthError'
        '404':
          $ref: '#/components/responses/OAuthError'
        '429':
          $ref: '#/components/responses/OAuthRateLimit'
        '503':
          $ref: '#/components/responses/OAuthError'
  /oauth/authorize:
    get:
      security: []
      operationId: oauthAuthorize
      description: >-
        Starts authorization-code OAuth using a registered public client or HTTPS client metadata document, mandatory RFC 8707 resource binding, PKCE S256, upstream vendor OIDC,
        and fail-closed access evaluation.
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            const: code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            description: Durable RFC 7591 client identifier or HTTPS URL of a client metadata document.
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: resource
          in: query
          required: true
          schema:
            type: string
            format: uri
            description: Exact Private MCP resource URL advertised by protected-resource metadata.
        - name: scope
          in: query
          required: false
          schema:
            type: string
            default: mcp:private
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            const: S256
      responses:
        '302':
          description: Redirect to the configured vendor IdP.
        '400':
          $ref: '#/components/responses/OAuthError'
  /oauth/callback:
    get:
      security: []
      operationId: oauthCallback
      description: >-
        For public OAuth states, verifies upstream state, nonce and ID token, resolves vendor access fail-closed, creates or resolves the durable customer account, then redirects
        with a one-time code. Prefixed administration-test states stop after OIDC, audience/client, nonce, issuer, and customer-claim verification and redirect to the fixed
        same-origin Identity page without retaining tokens or creating runtime identity data.
      responses:
        '302':
          description: Exact registered client redirect.
        '303':
          description: >-
            Fixed same-origin Identity-page redirect carrying identity_test_id for a stored result or
            identity_test_error=invalid_or_expired when the callback transaction cannot be claimed.
        '401':
          $ref: '#/components/responses/OAuthError'
  /oauth/token:
    post:
      security: []
      operationId: oauthToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                grant_type:
                  const: authorization_code
                code:
                  type: string
                code_verifier:
                  type: string
                client_id:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                resource:
                  type: string
                  format: uri
              required:
                - grant_type
                - code
                - code_verifier
                - client_id
                - redirect_uri
                - resource
      responses:
        '200':
          description: Short-lived opaque DokoSoko access token bound to the exact Private MCP resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          $ref: '#/components/responses/OAuthError'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /agent-setup/{kind}/prompt.md:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
            - public
            - private
    get:
      security: []
      operationId: getAgentSetupPrompt
      description: >-
        Secret-free, client-specific setup instructions derived from the canonical configured public origin. Public setup is unavailable while Public MCP is disabled; private setup
        is unavailable while customer identity is inactive.
      responses:
        '200':
          description: Setup prompt for Codex, Claude Code, Cursor, and OpenCode.
          content:
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
  /mcp/public:
    parameters:
      - $ref: '#/components/parameters/MCPProtocolVersion'
      - $ref: '#/components/parameters/MCPMethod'
      - $ref: '#/components/parameters/MCPName'
    post:
      security: []
      operationId: publicDeploymentMCP
      description: Canonical authentication-free Stateless MCPv2 endpoint for the singleton Deployment. Available only while Public MCP is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONRPCRequest'
      responses:
        '200':
          description: JSON-RPC result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '404':
          description: Public MCP is disabled.
        '429':
          description: Anonymous request budget exceeded.
  /mcp:
    parameters:
      - $ref: '#/components/parameters/MCPProtocolVersion'
      - $ref: '#/components/parameters/MCPMethod'
      - $ref: '#/components/parameters/MCPName'
    post:
      security:
        - dokoBearer: []
      operationId: privateDeploymentMCP
      description: Canonical authenticated Stateless MCPv2 endpoint for the singleton Deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONRPCRequest'
      responses:
        '200':
          description: JSON-RPC result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/sdks:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
    get:
      operationId: listIntegrationSDKReferences
      description: Lists exact, API-owned SDK installation references. DokoSoko does not mirror package bytes or maintain a package release lifecycle.
      responses:
        '200':
          description: Exact SDK references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDKReferenceList'
    post:
      operationId: createIntegrationSDKReference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SDKReferenceInput'
      responses:
        '201':
          description: SDK reference created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDKReference'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/sdks/{sdk_id}:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
      - name: sdk_id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: replaceIntegrationSDKReference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SDKReferenceInput'
      responses:
        '200':
          description: SDK reference updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDKReference'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteIntegrationSDKReference
      responses:
        '204':
          description: SDK reference deleted.
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dokosoko_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Administrator automation token in development only; production uses the root session cookie.
    setupToken:
      type: http
      scheme: bearer
      description: One-time deployment setup token.
    dokoBearer:
      type: http
      scheme: bearer
      description: Opaque, short-lived DokoSoko OAuth access token bound to one exact Private MCP resource.
  parameters:
    ProductID:
      name: product_id
      in: path
      required: true
      schema:
        type: string
    OrganisationID:
      name: organisation_id
      in: path
      required: true
      schema:
        type: string
    SourceID:
      name: source_id
      in: path
      required: true
      schema:
        type: string
    MCPConnectionID:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
    MCPProtocolVersion:
      name: MCP-Protocol-Version
      in: header
      required: true
      schema:
        type: string
        const: '2026-07-28'
    MCPMethod:
      name: Mcp-Method
      in: header
      required: true
      description: Must exactly match the JSON-RPC method.
      schema:
        type: string
        enum:
          - server/discover
          - tools/list
          - tools/call
    MCPName:
      name: Mcp-Name
      in: header
      required: false
      description: Required for tools/call and must exactly match params.name.
      schema:
        type: string
    IntegrationID:
      name: integration_id
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    NamedResource:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 120
              slug:
                type: string
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            required:
              - name
              - slug
    RootInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              email:
                type: string
                format: email
              display_name:
                type: string
                minLength: 1
                maxLength: 120
              password:
                type: string
                format: password
                minLength: 14
            required:
              - email
              - display_name
              - password
    MFACompletion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              enrollment_id:
                type: string
              code:
                type: string
            required:
              - enrollment_id
              - code
    Revision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              revision:
                type: integer
                format: int64
                minimum: 1
            required:
              - revision
    SourcePublication:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              revision:
                type: integer
                format: int64
                minimum: 1
              crawl_job_id:
                type: string
                minLength: 1
              document_ids:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
              acknowledge_reviewed:
                type: boolean
                const: true
            required:
              - revision
              - crawl_job_id
              - document_ids
              - acknowledge_reviewed
    VisibilityChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              visibility:
                $ref: '#/components/schemas/Visibility'
              acknowledge_public:
                type: boolean
                default: false
              revision:
                type: integer
                format: int64
                minimum: 1
            required:
              - visibility
              - revision
  responses:
    Error:
      description: Structured API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OAuthError:
      description: OAuth 2.0 error response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                type: string
              error_description:
                type: string
            required:
              - error
              - error_description
    OAuthRateLimit:
      description: OAuth client registration rate limit exceeded. Retrying after the advertised delay is safe.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                const: temporarily_unavailable
              error_description:
                type: string
            required:
              - error
              - error_description
    MFAEnrollment:
      description: Short-lived MFA enrollment; the TOTP secret is returned only during enrollment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFAEnrollment'
    AuthenticatedRoot:
      description: Authenticated root session. Recovery codes are returned only once when a root is created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              user:
                $ref: '#/components/schemas/RootUser'
              expires_at:
                type: string
                format: date-time
              csrf_token:
                type: string
                description: Double-submit CSRF token also set in the dokosoko_csrf cookie.
              recovery_codes:
                type: array
                items:
                  type: string
            required:
              - user
    RootList:
      description: Root users without password, TOTP, or recovery-code material.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/RootUser'
            required:
              - items
    ConfirmationOrRevisionConflict:
      description: Public confirmation is required, or the supplied revision is stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    DeploymentInput:
      type: object
      properties:
        organisation_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description:
          type: string
          maxLength: 2000
        public_mcp_enabled:
          type: boolean
          default: false
        revision:
          type: integer
          format: int64
          minimum: 1
      required:
        - name
        - slug
    Deployment:
      allOf:
        - $ref: '#/components/schemas/DeploymentInput'
        - type: object
          properties:
            id:
              type: string
            organisation_id:
              type: string
            catalog_revision:
              type: integer
              format: int64
              minimum: 1
            revision:
              type: integer
              format: int64
              minimum: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
          required:
            - id
            - organisation_id
            - catalog_revision
            - revision
            - created_at
            - updated_at
    CreateIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        family_key:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        version_key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        visibility:
          type: string
          enum:
            - private
            - public
          default: private
          description: Public Integrations appear on the unauthenticated read-only MCP surface.
        acknowledge_public:
          type: boolean
          default: false
          description: Must be true when visibility is public.
        lifecycle:
          type: string
          enum:
            - draft
            - active
            - deprecated
            - retired
        replacement_integration_id:
          type: string
        sunset_at:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - family_key
        - version_key
        - display_name
    ReplaceIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        family_key:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        version_key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        visibility:
          type: string
          enum:
            - private
            - public
        acknowledge_public:
          type: boolean
          default: false
        lifecycle:
          type: string
          enum:
            - draft
            - active
            - deprecated
            - retired
        replacement_integration_id:
          type: string
        sunset_at:
          type:
            - string
            - 'null'
          format: date-time
        revision:
          type: integer
          format: int64
          minimum: 1
      required:
        - family_key
        - version_key
        - display_name
        - description
        - visibility
        - lifecycle
        - revision
    ResourceSetRevision:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Present only after a configuration has been saved.
        resource_set_id:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 1
        manifest:
          type: array
          items: {}
        content_hash:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - resource_set_id
        - revision
        - manifest
        - content_hash
        - created_at
    IntegrationResourceLink:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        integration_id:
          type: string
        resource_set_id:
          type: string
        kind:
          type: string
          enum:
            - documentation
            - api
        name:
          type: string
        follow_latest:
          type: boolean
        pinned_revision_id:
          type: string
        resolved_revision:
          $ref: '#/components/schemas/ResourceSetRevision'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - integration_id
        - resource_set_id
        - kind
        - name
        - follow_latest
        - created_at
        - updated_at
    GrantDefinition:
      type: object
      additionalProperties: false
      description: Deployment-owned authorization vocabulary. A definition may be referenced by policy but never grants access by itself.
      properties:
        id:
          type: string
        deployment_id:
          type: string
        organisation_id:
          type: string
        key:
          type: string
          pattern: ^[a-z][a-z0-9_-]*(\.[a-z][a-z0-9_-]*)+$
          maxLength: 160
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        risk:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        state:
          type: string
          enum:
            - active
            - deprecated
        revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - deployment_id
        - organisation_id
        - key
        - display_name
        - description
        - risk
        - state
        - revision
        - created_at
        - updated_at
    GrantDefinitionList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GrantDefinition'
      required:
        - items
    CreateGrantDefinitionRequest:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_-]*(\.[a-z][a-z0-9_-]*)+$
          maxLength: 160
          description: Stable dotted lower-case key; immutable after creation.
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
          default: ''
        risk:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
          default: low
        state:
          type: string
          enum:
            - active
            - deprecated
          default: active
      required:
        - key
        - display_name
    UpdateGrantDefinitionRequest:
      type: object
      additionalProperties: false
