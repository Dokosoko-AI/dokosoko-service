          description: >-
            Latest non-secret question limited to 2,048 UTF-8 bytes after trimming. Credential-like material,
            destination URLs, nonce-shaped material, and UUID-shaped internal identifiers are rejected.
        history:
          type: array
          maxItems: 12
          description: >-
            Chronological untrusted user/assistant context. Combined role/content data is limited to 12,288 UTF-8 bytes, rejected when credential-like or containing a destination
            URL, nonce-shaped material, or UUID-shaped internal identifier, and never persisted as tool state.
          items:
            $ref: '#/components/schemas/ToolTestAnalysisMessage'
      required:
        - revision
        - evidence_hash
        - consent_to_analysis_provider
        - question
    ToolTestAnalysisProposal:
      type: object
      additionalProperties: false
      description: >-
        Complete non-secret candidate merged onto and locally validated against the exact base revision. Examples, endpoint, upstream authentication configuration and derived
        credential presence are preserved from server state rather than accepted from the provider. This object remains human-review-only.
      properties:
        proposal_id:
          type: string
          format: uuid
        base_tool_id:
          type: string
        base_revision:
          type: integer
          format: int64
          minimum: 1
        base_fingerprint:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        requires_clone:
          type: boolean
          description: True for an immutable published base. The proposal cannot be applied in place.
        draft:
          $ref: '#/components/schemas/ToolDraft'
        changes:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ToolDraftChange'
        findings:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/ToolDraftFinding'
        valid:
          type: boolean
      required:
        - proposal_id
        - base_tool_id
        - base_revision
        - base_fingerprint
        - requires_clone
        - draft
        - changes
        - findings
        - valid
    ToolTestAnalysis:
      type: object
      additionalProperties: false
      description: Advisory provider reply bound to one exact evidence hash and revision. No tool or upstream mutation occurs.
      properties:
        tool_revision:
          type: integer
          format: int64
          minimum: 1
        evidence_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: Returned to let the browser reject a response not bound to its consent preview; not sent to the provider.
        reply:
          type: string
          minLength: 1
          maxLength: 2000
        findings:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ToolDraftFinding'
        proposal:
          $ref: '#/components/schemas/ToolTestAnalysisProposal'
        provider_outcome:
          type: string
          enum:
            - succeeded
            - unusable
        advisory:
          type: boolean
          const: true
        generated_at:
          type: string
          format: date-time
      required:
        - tool_revision
        - evidence_hash
        - reply
        - findings
        - provider_outcome
        - advisory
        - generated_at
