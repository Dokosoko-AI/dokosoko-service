      responses:
        '200':
          description: Recipes with their current immutable revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeList'
    post:
      tags: ["Recipes and Analysis"]
      operationId: createRecipe
      description: Analyses every eligible published API, lets the configured AI select only exact reviewed capabilities required by the developer outcome, and creates one deployment recipe with the detected API attachments. integration_ids may explicitly bound detection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 4000
                integration_id:
                  type: string
                  minLength: 1
