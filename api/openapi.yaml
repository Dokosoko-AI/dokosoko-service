openapi: 3.1.0
info:
  title: DokoSoko Control Plane API
  version: 3.0.0
  description: >-
    UI and automation contract for one DokoSoko Deployment and its versioned
    API Integrations. Cookie-authenticated mutations
    additionally require the dokosoko_csrf cookie value in X-CSRF-Token and an
    exact Origin matching the configured public URL. Public MCP is a separate,
    authentication-free protocol surface and is disabled by default. Every MCP
    surface and managed upstream bridge is Stateless MCPv2 Only, fixed to the
    2026-07-28 protocol revision.
servers:
  - url: https://dokosoko.example.com
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                required: [status]
  /readyz:
    get:
      security: []
      operationId: readiness
      responses:
        "200":
          description: Persistence is reachable and migrations are applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/deployment:
    get:
      operationId: getDeployment
      responses:
        "200": { description: Singleton DokoSoko deployment., content: { application/json: { schema: { $ref: "#/components/schemas/Deployment" } } } }
    post:
      operationId: createDeployment
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DeploymentInput" } } } }
      responses:
        "201": { description: Deployment created., content: { application/json: { schema: { $ref: "#/components/schemas/Deployment" } } } }
        "409": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateDeployment
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DeploymentInput" } } } }
      responses:
        "200": { description: Deployment updated., content: { application/json: { schema: { $ref: "#/components/schemas/Deployment" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/environments:
    get:
      operationId: listDeploymentEnvironments
      responses:
        "200": { description: Deployment environments., content: { application/json: { schema: { $ref: "#/components/schemas/EnvironmentList" } } } }
    post:
      operationId: createDeploymentEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organisation_id: { type: string }
                name: { type: string }
                slug: { type: string }
                is_production: { type: boolean }
              required: [organisation_id, name, slug]
      responses:
        "201": { description: Environment created., content: { application/json: { schema: { $ref: "#/components/schemas/Environment" } } } }
  /api/v1/integrations:
    get:
      operationId: listIntegrations
      responses:
        "200": { description: Versioned API Integrations., content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationList" } } } }
    post:
      operationId: createIntegration
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateIntegrationRequest" } } } }
      responses:
        "201": { description: Integration created., content: { application/json: { schema: { $ref: "#/components/schemas/Integration" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/integrations/{integration_id}:
    parameters:
      - { name: integration_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getIntegration
      responses:
        "200":
          description: Integration, immutable revision history, and current publish readiness/diff.
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration: { $ref: "#/components/schemas/Integration" }
                  revisions: { type: array, items: { $ref: "#/components/schemas/IntegrationRevision" } }
                  publish_status: { $ref: "#/components/schemas/IntegrationPublishStatus" }
                required: [integration, revisions, publish_status]
    put:
      operationId: replaceIntegration
      description: Replaces the complete mutable Integration representation. Changing visibility from private to public requires acknowledge_public=true, and the change does not appear publicly until the resulting Integration snapshot is published.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReplaceIntegrationRequest" } } } }
      responses:
        "200": { description: Integration updated., content: { application/json: { schema: { $ref: "#/components/schemas/Integration" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/integrations/{integration_id}/publish:
    parameters:
      - { name: integration_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: publishIntegration
      responses:
        "201": { description: Immutable Integration revision., content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationRevision" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/integrations/{integration_id}/access-connections:
    parameters:
      - { name: integration_id, in: path, required: true, schema: { type: string } }
    put:
      operationId: setIntegrationAccessConnections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                access_connection_ids: { type: array, items: { type: string }, uniqueItems: true }
              required: [access_connection_ids]
      responses:
        "200": { description: Integration with its explicit access assignments., content: { application/json: { schema: { $ref: "#/components/schemas/Integration" } } } }
  /api/v1/integrations/{integration_id}/support-route:
    parameters:
      - { name: integration_id, in: path, required: true, schema: { type: string } }
    put:
      operationId: setIntegrationSupportRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                support_route_id: { type: string, description: Empty to inherit the Deployment default. }
              required: [support_route_id]
      responses:
        "200": { description: Integration with its explicit support-route assignment., content: { application/json: { schema: { $ref: "#/components/schemas/Integration" } } } }
  /api/v1/integrations/{integration_id}/resource-sets:
    parameters:
      - { name: integration_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: attachIntegrationResourceSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resource_set_id: { type: string }
                pinned_revision_id: { type: string }
              required: [resource_set_id]
      responses:
        "200": { description: Explicit Integration resource link., content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationResourceLink" } } } }
  /api/v1/integrations/{integration_id}/resource-sets/{resource_set_id}:
    parameters:
      - { name: integration_id, in: path, required: true, schema: { type: string } }
      - { name: resource_set_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: detachIntegrationResourceSet
      responses:
        "204": { description: Resource set detached. }
  /api/v1/resource-sets:
    get:
      operationId: listResourceSets
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [documentation, api] } }
      responses:
        "200": { description: Reusable resource sets., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceSetList" } } } }
    post:
      operationId: createResourceSet
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceSetInput" } } } }
      responses:
        "201": { description: Resource set and first revision., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceSet" } } } }
  /api/v1/resource-sets/{resource_set_id}:
    parameters:
      - { name: resource_set_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getResourceSet
      responses:
        "200": { description: Resource set., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceSet" } } } }
    patch:
      operationId: updateResourceSet
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceSetInput" } } } }
      responses:
        "200": { description: Resource set with a new immutable content revision., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceSet" } } } }
  /api/v1/resource-sets/{resource_set_id}/duplicate:
    parameters:
      - { name: resource_set_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: duplicateResourceSet
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { name: { type: string } }, required: [name] } } }
      responses:
        "201": { description: Independent resource-set copy., content: { application/json: { schema: { $ref: "#/components/schemas/ResourceSet" } } } }
  /api/v1/access-definitions:
    get:
      operationId: listAccessDefinitions
      responses:
        "200": { description: Provider access contracts., content: { application/json: { schema: { $ref: "#/components/schemas/AccessDefinitionList" } } } }
    post:
      operationId: createAccessDefinition
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AccessDefinitionInput" } } } }
      responses:
        "201": { description: Access definition created., content: { application/json: { schema: { $ref: "#/components/schemas/AccessDefinition" } } } }
  /api/v1/access-connections:
    get:
      operationId: listAccessConnections
      responses:
        "200": { description: Configured vendor accounts., content: { application/json: { schema: { $ref: "#/components/schemas/AccessConnectionList" } } } }
    post:
      operationId: createAccessConnection
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AccessConnectionInput" } } } }
      responses:
        "201": { description: Access connection created with its management credential encrypted., content: { application/json: { schema: { $ref: "#/components/schemas/AccessConnection" } } } }
  /api/v1/access-connections/{connection_id}/instances:
    parameters:
      - { name: connection_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listAccessInstances
      responses:
        "200": { description: Provider-owned resource metadata., content: { application/json: { schema: { $ref: "#/components/schemas/AccessInstanceList" } } } }
  /api/v1/access-connections/{connection_id}/credentials:
    parameters:
      - { name: connection_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listAccessCredentials
      responses:
        "200": { description: Credential fingerprints and lifecycle metadata; never plaintext., content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialList" } } } }
  /api/v1/backend-connections:
    get:
      operationId: listBackendConnections
      responses:
        "200": { description: Operator-managed service-to-service connections., content: { application/json: { schema: { $ref: "#/components/schemas/BackendConnectionList" } } } }
    post:
      operationId: createBackendConnection
      description: Creates a service-to-service connection. The bearer credential is accepted only on creation and is never returned. Name is unique within the Deployment; retrying the exact same representation returns the existing resource, while reusing the name with different content returns 409.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateBackendConnectionRequest" } } } }
      responses:
        "201": { description: Backend connection created., content: { application/json: { schema: { $ref: "#/components/schemas/BackendConnection" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/backend-connections/{connection_id}:
    parameters:
      - { name: connection_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getBackendConnection
      responses:
        "200": { description: Backend connection with redacted credential metadata., content: { application/json: { schema: { $ref: "#/components/schemas/BackendConnection" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: replaceBackendConnection
      description: Replaces connection metadata without changing its credential. Use the credentials subresource for rotation. An exact retry after a committed update returns the current resource; a stale revision with different content returns 409.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReplaceBackendConnectionRequest" } } } }
      responses:
        "200": { description: Backend connection replaced., content: { application/json: { schema: { $ref: "#/components/schemas/BackendConnection" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/backend-connections/{connection_id}/credentials:
    parameters:
      - { name: connection_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: createBackendConnectionCredential
      description: Creates and atomically activates a new credential version. Retrying the same credential content returns the active credential version; a stale revision with different credential content returns 409 and leaves the existing active credential unchanged.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateBackendConnectionCredentialRequest" } } } }
      responses:
        "201": { description: Credential version created and activated., content: { application/json: { schema: { $ref: "#/components/schemas/BackendConnectionCredential" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/support-routes:
    get:
      operationId: listSupportRoutes
      responses:
        "200": { description: Default and Integration-specific support routes., content: { application/json: { schema: { $ref: "#/components/schemas/SupportRouteList" } } } }
    post:
      operationId: createSupportRoute
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateSupportRouteRequest" } } } }
      responses:
        "201": { description: Support route created., content: { application/json: { schema: { $ref: "#/components/schemas/SupportRoute" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/support-routes/{route_id}:
    parameters:
      - { name: route_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSupportRoute
      responses:
        "200": { description: Support route., content: { application/json: { schema: { $ref: "#/components/schemas/SupportRoute" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: replaceSupportRoute
      description: Replaces the complete mutable route representation. Delivery authentication belongs to the referenced backend connection.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReplaceSupportRouteRequest" } } } }
      responses:
        "200": { description: Support route updated., content: { application/json: { schema: { $ref: "#/components/schemas/SupportRoute" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/setup/status:
    get:
      security: []
      operationId: setupStatus
      responses:
        "200":
          description: First-run setup state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_complete: { type: boolean }
                  requires_mfa: { const: true }
                required: [setup_complete, requires_mfa]
  /api/v1/setup/begin:
    post:
      security: [{ setupToken: [] }]
      operationId: beginSetup
      requestBody: { $ref: "#/components/requestBodies/RootInput" }
      responses:
        "201": { $ref: "#/components/responses/MFAEnrollment" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/setup/complete:
    post:
      security: []
      operationId: completeSetup
      requestBody: { $ref: "#/components/requestBodies/MFACompletion" }
      responses:
        "201": { $ref: "#/components/responses/AuthenticatedRoot" }
  /api/v1/auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                code: { type: string, description: TOTP or unused recovery code. }
              required: [email, password, code]
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedRoot" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Session ended and cookies expired. }
  /api/v1/auth/session:
    get:
      operationId: currentSession
      responses:
        "200":
          description: Current root session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/RootUser" }
                  expires_at: { type: string, format: date-time }
                required: [user, expires_at]
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/root/users:
    get:
      operationId: listRootUsers
      responses:
        "200": { $ref: "#/components/responses/RootList" }
    post:
      operationId: beginRootUser
      requestBody: { $ref: "#/components/requestBodies/RootInput" }
      responses:
        "201": { $ref: "#/components/responses/MFAEnrollment" }
    put:
      operationId: completeRootUser
      requestBody: { $ref: "#/components/requestBodies/MFACompletion" }
      responses:
        "201": { $ref: "#/components/responses/AuthenticatedRoot" }
  /api/v1/root/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeRootUser
      description: Self-revocation and revocation of the last active root are rejected.
      responses:
        "204": { description: Root revoked and active sessions ended. }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/system/doctor:
    get:
      operationId: runSystemDoctor
      responses:
        "200":
          description: Redacted, non-destructive system checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemDoctor" }
  /api/v1/organisations:
    get:
      operationId: listOrganisations
      responses:
        "200":
          description: Organisation list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationList" }
    post:
      operationId: createOrganisation
      requestBody: { $ref: "#/components/requestBodies/NamedResource" }
      responses:
        "201":
          description: Organisation created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organisation" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/organisations/{organisation_id}/products:
    parameters:
      - $ref: "#/components/parameters/OrganisationID"
    get:
      operationId: listProducts
      responses:
        "200":
          description: Product list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
    post:
      operationId: createProduct
      requestBody: { $ref: "#/components/requestBodies/NamedResource" }
      responses:
        "201":
          description: Product created private-first with Public MCP disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /api/v1/organisations/{organisation_id}/audit:
    parameters:
      - $ref: "#/components/parameters/OrganisationID"
    get:
      operationId: listAuditEvents
      responses:
        "200":
          description: Up to 500 newest append-only organisation audit events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
  /api/v1/products/{product_id}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    patch:
      operationId: updateProductDiscoverySettings
      description: Updates the agent-facing product description and the default version channel for unpinned customers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: { type: string, minLength: 1, maxLength: 1000 }
                default_version_policy: { type: string, enum: [latest, lts] }
                require_promotion_approval: { type: boolean, default: false }
                revision: { type: integer, format: int64, minimum: 1 }
              required: [description, default_version_policy, require_promotion_approval, revision]
      responses:
        "200":
          description: Updated product discovery settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/description/rewrite:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    post:
      operationId: rewriteProductDescription
      description: Uses the enabled assistant LLM profile to return an editable MCP-facing draft. The draft is never saved automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                draft: { type: string, minLength: 1, maxLength: 2000 }
              required: [draft]
      responses:
        "200":
          description: Unsaved rewritten description draft.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  description: { type: string, minLength: 1, maxLength: 1000 }
                required: [description]
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/versions:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listProductVersions
      responses:
        "200":
          description: Published immutable Product Definition compatibility snapshots, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductVersionList" }
    post:
      operationId: publishProductVersion
      description: Publishes one immutable compatibility-profile snapshot. The first product version is automatically marked latest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
                profile_id: { type: string }
                is_latest: { type: boolean, default: false }
                is_lts: { type: boolean, default: false }
                release_stage: { type: string, enum: [preview, active], default: active }
                rollout_percentage: { type: integer, minimum: 1, maximum: 100, default: 100 }
              required: [version, profile_id]
      responses:
        "201":
          description: Product version published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductVersion" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/versions/{version_id}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: version_id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateProductVersionLifecycle
      description: Updates latest, LTS, and deprecation guidance without mutating the version's compatibility snapshot or silently moving customer pins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                is_latest: { type: boolean }
                is_lts: { type: boolean }
                deprecated: { type: boolean }
                deprecation_message: { type: string, maxLength: 500 }
                replacement_version: { type: string }
                sunset_at: { type: [string, "null"], format: date-time }
                rollout_percentage: { type: integer, minimum: 1, maximum: 100 }
                acknowledge_impact: { type: boolean, default: false }
                revision: { type: integer, format: int64, minimum: 1 }
              required: [is_latest, is_lts, deprecated, rollout_percentage, acknowledge_impact, revision]
      responses:
        "200":
          description: Updated product-version lifecycle metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductVersion" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/versions/{version_id}/diff:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/ProductVersionID"
    get:
      operationId: getProductVersionDiff
      description: Returns the immutable structural diff generated automatically when the product version was published.
      responses:
        "200":
          description: Generated release diff within this product. Incompatible API lines are modeled as separate products.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductVersionDiff" }
  /api/v1/products/{product_id}/versions/{version_id}/impact:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/ProductVersionID"
    get:
      operationId: getProductVersionImpact
      responses:
        "200":
          description: Scoped assignments and 30-day product-version activity affected by deprecation or sunset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductVersionImpact" }
  /api/v1/products/{product_id}/versions/{version_id}/reconcile:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/ProductVersionID"
    post:
      operationId: reconcileProductVersionArtifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
              required: [revision]
      responses:
        "200":
          description: Product version with refreshed operational drift status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductVersion" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/versions/{version_id}/promotion:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/ProductVersionID"
    post:
      operationId: changeProductVersionPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                action: { type: string, enum: [request, approve, reject] }
                note: { type: string, maxLength: 500 }
                revision: { type: integer, format: int64, minimum: 1 }
              required: [action, note, revision]
      responses:
        "200":
          description: Updated promotion state. Approval rechecks drift and enforces separation of duties when configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductVersion" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/version-pins:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listProductVersionPins
      responses:
        "200":
          description: Exact customer, environment, and installation product-version pins.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductVersionPinList" }
    post:
      operationId: saveProductVersionPin
      description: Creates or replaces an optimistic-concurrency protected scoped pin. New pins cannot target deprecated versions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scope: { type: string, enum: [customer, environment, installation] }
                scope_id: { type: string, minLength: 1, maxLength: 200 }
                customer_account_id: { type: string, maxLength: 200, description: DokoSoko customer-account resource ID. }
                product_version_id: { type: string }
                reason: { type: string, maxLength: 500 }
                revision: { type: integer, format: int64, minimum: 0 }
              required: [scope, scope_id, product_version_id, revision]
      responses:
        "200":
          description: Saved customer pin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductVersionPin" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/version-pins/history:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listProductVersionPinHistory
      responses:
        "200":
          description: Immutable scoped pin assignment history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductVersionPinHistoryList" }
  /api/v1/products/{product_id}/version-pins/{pin_id}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: pin_id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteProductVersionPin
      description: Removes the exact scoped pin so future discovery follows the next resolution level.
      responses:
        "204": { description: Scoped pin removed. }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/installations:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listProductInstallations
      responses:
        "200":
          description: Registered integration installations used for authenticated scoped resolution.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductInstallationList" }
    post:
      operationId: saveProductInstallation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                id: { type: string }
                customer_account_id: { type: string, minLength: 1, maxLength: 200 }
                environment_id: { type: string }
                external_id: { type: string, minLength: 1, maxLength: 200 }
                name: { type: string, minLength: 1, maxLength: 120 }
                state: { type: string, enum: [active, paused] }
                revision: { type: integer, format: int64, minimum: 0 }
              required: [customer_account_id, environment_id, external_id, name, state, revision]
      responses:
        "200":
          description: Saved installation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductInstallation" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/customer-accounts:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listCustomerAccounts
      description: Lists customer accounts created from trusted vendor OIDC organization claims, newest first. Accounts are never created by this administrative endpoint.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: starting_after
          in: query
          description: Continue after this customer-account ID from the preceding page.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Customer accounts for this product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAccountList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/customer-accounts/{customer_account_id}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: customer_account_id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateCustomerAccount
      description: Suspends or reactivates a customer account using optimistic concurrency. Suspension invalidates existing DokoSoko access tokens on their next use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                state: { type: string, enum: [active, suspended] }
                revision: { type: integer, format: int64, minimum: 1 }
              required: [state, revision]
      responses:
        "200": { description: Updated customer account., content: { application/json: { schema: { $ref: "#/components/schemas/CustomerAccount" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/environments:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listEnvironments
      responses:
        "200":
          description: Environment list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentList" }
    post:
      operationId: createEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnvironmentRequest" }
      responses:
        "201":
          description: Environment created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/distribution:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: getProductDistribution
      responses:
        "200":
          description: MCP and widget distribution configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Distribution" }
    patch:
      operationId: updateProductDistribution
      description: Enabling Public MCP requires acknowledge_public=true. Disabling it does not require acknowledgement and takes effect immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                public_mcp_enabled: { type: boolean }
                acknowledge_public: { type: boolean, default: false }
                revision: { type: integer, format: int64, minimum: 1 }
              required: [public_mcp_enabled, revision]
      responses:
        "200":
          description: Updated product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "409": { $ref: "#/components/responses/ConfirmationOrRevisionConflict" }
  /api/v1/products/{product_id}/definition:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: getProductDefinition
      description: Returns the currently published evidence-backed product and version graph.
      responses:
        "200":
          description: Current Product Definition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDefinition" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/product-builds:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listProductBuilds
      responses:
        "200":
          description: Newest automatic product build runs first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductBuildList" }
    post:
      operationId: buildProductAutomatically
      description: Scans every attached source, HTTP tool, and MCP connection plus optional supplemental inputs. The result is always a reviewable draft and never silently changes a published definition or customer version pin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                inputs:
                  type: array
                  maxItems: 50
                  items: { $ref: "#/components/schemas/ProductBuildInput" }
              required: [inputs]
      responses:
        "201":
          description: Product graph generated for review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductBuild" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/product-builds/{build_id}/publish:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: build_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: publishProductBuild
      description: Publishes one reviewed graph. Blocking findings fail closed; warnings remain visible. Existing customer integration pins are not moved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Published Product Definition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDefinition" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/sources:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listSources
      responses:
        "200":
          description: Product sources.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
                required: [items]
    post:
      operationId: createSource
      description: Creates a private, unpublished source.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSourceRequest" }
      responses:
        "201":
          description: Source created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/sources/{source_id}/crawl:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/SourceID"
    post:
      operationId: queueSourceCrawl
      responses:
        "202":
          description: Crawl queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlJob" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/sources/{source_id}/crawls:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/SourceID"
    get:
      operationId: listSourceCrawls
      responses:
        "200":
          description: Crawl state, counts, and redacted errors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlJobList" }
  /api/v1/products/{product_id}/sources/{source_id}/publish:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/SourceID"
    post:
      operationId: publishSource
      description: Atomically publishes the validated revision. Quarantined sources are rejected.
      requestBody: { $ref: "#/components/requestBodies/Revision" }
      responses:
        "200":
          description: Source published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/sources/{source_id}/visibility:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: source_id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateSourceVisibility
      description: A private-to-public transition requires acknowledge_public=true and is audit logged. A public-to-private transition is immediate.
      requestBody:
        $ref: "#/components/requestBodies/VisibilityChange"
      responses:
        "200":
          description: Updated source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "409": { $ref: "#/components/responses/ConfirmationOrRevisionConflict" }
        "422":
          description: The resource is quarantined or otherwise unsafe for anonymous publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/products/{product_id}/tools:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listTools
      responses:
        "200":
          description: Draft and published custom tools; secrets and fixed destinations are redacted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolList" }
    post:
      operationId: createTool
      description: Creates a draft one-call HTTP tool with JSON Schemas, a fixed HTTPS destination on the configured vendor API origin, and an authorization policy. Runtime calls use the authenticated customer's delegated vendor access token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateToolRequest" }
      responses:
        "201":
          description: Draft tool created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tool" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/tools/{tool_id}/publish:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: tool_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: publishTool
      requestBody: { $ref: "#/components/requestBodies/Revision" }
      responses:
        "200":
          description: Tool published to authorized Private MCP discovery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tool" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/mcp-connections:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listMCPConnections
      description: Lists redacted managed upstreams. Credentials and delegated user grants are never returned.
      responses:
        "200":
          description: Connections plus the immutable Stateless MCPv2 policy and specification link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPConnectionList" }
    post:
      operationId: createMCPConnection
      description: Registers one fixed HTTPS upstream. The protocol is always 2026-07-28 and logical live sessions are unsupported.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMCPConnectionRequest" }
      responses:
        "201":
          description: Redacted connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPConnection" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/mcp-connections/{connection_id}/inspect:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/MCPConnectionID"
    post:
      operationId: inspectMCPConnection
      description: Fetches one complete Stateless MCPv2 tool catalog without importing or publishing anything.
      responses:
        "200":
          description: Untrusted upstream catalog for administrative review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPCatalog" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/mcp-connections/{connection_id}/import:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/MCPConnectionID"
    post:
      operationId: importMCPTools
      description: Explicitly selects, namespaces, normalizes, and schema-pins upstream tools as local drafts. Published schema drift fails closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportMCPToolsRequest" }
      responses:
        "200":
          description: Import, update, rejection, and drift results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPImportResult" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/identity-provider:
    get:
      operationId: getIdentityProvider
      responses:
        "200":
          description: Optional delegated customer identity provider configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: replaceIdentityProvider
      description: Replaces the optional delegated identity configuration. Disabling it immediately invalidates private customer authorization; it does not affect public discovery or backend delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceIdentityProviderRequest" }
      responses:
        "200":
          description: Identity provider configuration saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/support-submissions:
    get:
      operationId: listSupportSubmissions
      summary: List decrypted support submissions for the administrative inbox
      description: The database stores submission content encrypted. This authenticated root-only response decrypts only the bounded summary and trusted routing context needed by the inbox; full content is fetched separately on demand.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: starting_after
          in: query
          description: Continue after this support-submission ID from the preceding page.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Newest support submissions first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportSubmissionList" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/support-submissions/{submission_id}:
    parameters:
      - name: submission_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSupportSubmission
      summary: Decrypt one support submission for administrative review
      responses:
        "200":
          description: Full schema-bounded report content and delivery metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportSubmission" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/support-submissions/{submission_id}/delivery-attempts:
    parameters:
      - name: submission_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: createSupportDeliveryAttempt
      summary: Queue a held or failed submission for another idempotent delivery attempt
      description: Safe to retry after an ambiguous network failure. A submission already pending or delivering is returned unchanged with 202; delivered or expired submissions return 409.
      responses:
        "202":
          description: The delivery attempt was accepted and the submission is pending asynchronous delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportSubmission" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/providers:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listProviders
      deprecated: true
      description: Legacy compatibility surface. Use Access Definitions and Access Connections.
      responses:
        "200":
          description: Redacted Provider API connections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderList" }
    post:
      operationId: createProvider
      deprecated: true
      description: Legacy compatibility surface. Use an Access Definition and Access Connection instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProviderRequest" }
      responses:
        "201":
          description: Provider connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/projects:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listProjects
      deprecated: true
      description: Legacy DokoSoko Project records. Provider-owned resources are now managed through Access Connections.
      responses:
        "200":
          description: Issued project metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
  /api/v1/products/{product_id}/credentials:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listCredentialLeases
      deprecated: true
      description: Legacy credential leases. Use Access Connection credential metadata instead.
      responses:
        "200":
          description: Credential lease metadata and SHA-256 fingerprints; never credential plaintext.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialLeaseList" }
  /api/v1/products/{product_id}/llm-profiles:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listLLMProfiles
      responses:
        "200":
          description: Credential-redacted role-based AI profiles and mandatory hardening policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMProfileList" }
    put:
      operationId: saveLLMProfile
      description: Creates or replaces a role profile. Mandatory untrusted-context hardening cannot be disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveLLMProfileRequest" }
      responses:
        "200":
          description: Profile saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMProfile" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/ai/connections:
    get:
      operationId: listAIProviderConnections
      description: Lists credential-redacted provider connections shared by the Analysis and Assistant workloads.
      responses:
        "200": { description: AI provider connections., content: { application/json: { schema: { $ref: "#/components/schemas/AIProviderConnectionList" } } } }
    post:
      operationId: saveAIProviderConnection
      description: Creates, updates, or rotates one provider connection. Native provider origins are fixed; credentials are encrypted and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveAIProviderConnectionRequest" }
      responses:
        "200": { description: Existing connection updated., content: { application/json: { schema: { $ref: "#/components/schemas/AIProviderConnection" } } } }
        "201": { description: Connection created., content: { application/json: { schema: { $ref: "#/components/schemas/AIProviderConnection" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/ai/connections/{connection_id}/test:
    parameters:
      - name: connection_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: testAIProviderConnection
      description: Makes a minimal provider request and stores only normalized health metadata.
      responses:
        "200": { description: Connection accepted by the provider., content: { application/json: { schema: { $ref: "#/components/schemas/AIProviderConnection" } } } }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/ai-profiles:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listAIWorkloadProfiles
      description: Lists the provider, model, limits, and immutable hardening policy for each narrow workload.
      responses:
        "200": { description: Workload profiles., content: { application/json: { schema: { $ref: "#/components/schemas/AIWorkloadProfileList" } } } }
  /api/v1/products/{product_id}/ai-profiles/{workload}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: workload
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AIWorkload" }
    put:
      operationId: saveAIWorkloadProfile
      description: Selects a provider connection and model for one workload. No model tools or authorization decisions are enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveAIWorkloadProfileRequest" }
      responses:
        "200": { description: Workload profile saved., content: { application/json: { schema: { $ref: "#/components/schemas/AIWorkloadProfile" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/analyses:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listIntegrationAnalyses
      responses:
        "200": { description: Newest evidence-backed analyses first., content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationAnalysisList" } } } }
    post:
      operationId: analyseIntegration
      description: Builds a versioned plan from known DokoSoko evidence. AI extraction may enrich the plan but cannot invent references or hide unknowns.
      responses:
        "201": { description: Analysis ready for human review., content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationAnalysis" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/analyses/{analysis_id}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: analysis_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getIntegrationAnalysis
      responses:
        "200": { description: Analysis and its explicit unknowns., content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationAnalysis" } } } }
    patch:
      operationId: answerIntegrationUnknowns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                answers: { type: object, additionalProperties: { type: string, maxLength: 8000 } }
              required: [answers]
      responses:
        "200": { description: Analysis with supplied answers., content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationAnalysis" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/analyses/{analysis_id}/recipes:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: analysis_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: generateRecipes
      description: Creates review-state Markdown recipes and durable job records. Blocking unknowns prevent generation.
      responses:
        "201": { description: Generated recipes., content: { application/json: { schema: { $ref: "#/components/schemas/RecipeList" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/recipes:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listRecipes
      description: Reconciles source drift before returning the human review queue.
      responses:
        "200": { description: Recipes with their current immutable revision., content: { application/json: { schema: { $ref: "#/components/schemas/RecipeList" } } } }
    post:
      operationId: createRecipe
      description: Analyses current product evidence and creates one AI-assisted recipe from a developer outcome prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                prompt: { type: string, minLength: 1, maxLength: 4000 }
              required: [prompt]
      responses:
        "201": { description: Generated recipe ready for review., content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/recipes/{recipe_id}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: recipe_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRecipe
      responses:
        "200":
          description: Recipe plus complete immutable revision history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  recipe: { $ref: "#/components/schemas/Recipe" }
                  revisions: { type: array, items: { $ref: "#/components/schemas/RecipeRevision" } }
                required: [recipe, revisions]
    patch:
      operationId: updateRecipeMarkdown
      description: Creates a human-authored revision. References must resolve to known analyzed HTTPS sources.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRecipeRequest" }
      responses:
        "200": { description: New review-state recipe revision., content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/recipes/{recipe_id}/rework:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: recipe_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: reworkRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                instruction: { type: string, minLength: 1, maxLength: 8000 }
              required: [instruction]
      responses:
        "200": { description: New generated revision ready for review., content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/recipes/{recipe_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: recipe_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: approveRecipe
      description: Records explicit human approval of the current revision. Validation errors fail closed.
      responses:
        "200": { description: Approved recipe., content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/recipes/{recipe_id}/publish:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: recipe_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: publishRecipe
      description: Publishes only the approved current revision. Public recipes may reference only public, published, non-quarantined sources.
      responses:
        "200": { description: Recipe available as a stable MCP resource., content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/ai-jobs:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listAIJobs
      responses:
        "200": { description: Durable analysis and authoring job history., content: { application/json: { schema: { $ref: "#/components/schemas/AIJobList" } } } }
  /api/v1/products/{product_id}/attention:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: getRecipeAttention
      description: In-product notification inbox for unanswered analysis questions and recipes invalidated by source drift.
      responses:
        "200": { description: Items requiring human attention., content: { application/json: { schema: { $ref: "#/components/schemas/RecipeAttention" } } } }
  /api/v1/products/{product_id}/recipe-analytics:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: getRecipeAnalytics
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200": { description: Recipe views and explicit implementation-plan selections., content: { application/json: { schema: { $ref: "#/components/schemas/RecipeAnalytics" } } } }
  /api/v1/products/{product_id}/ai-usage:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: getAIUsage
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200": { description: Provider operations, normalized failures, token counts, and latency by workload., content: { application/json: { schema: { $ref: "#/components/schemas/AIUsage" } } } }
  /api/v1/products/{product_id}/integration-runs:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listIntegrationRuns
      responses:
        "200":
          description: Up to 500 newest product integration runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationRunList" }
    post:
      operationId: startIntegrationRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                environment_id: { type: string }
                requested_outcome: { type: string, minLength: 1, maxLength: 500 }
              required: [environment_id, requested_outcome]
      responses:
        "201":
          description: Owner-scoped run started and funnel event recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationRun" }
  /api/v1/products/{product_id}/integration-runs/{run_id}/complete:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: run_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: completeIntegrationRun
      description: Only the starting principal can complete a run; a deterministic validation result is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reported_success: { type: boolean }
                validated_success: { type: boolean }
                failure_code: { type: string, maxLength: 120 }
              required: [validated_success]
      responses:
        "200":
          description: Run completed and analytics updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationRun" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/products/{product_id}/analytics:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: days
        in: query
        schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
    get:
      operationId: getAnalytics
      responses:
        "200":
          description: Scoped adoption, channel, funnel, and deterministic success metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSummary" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/widgets:
    get:
      operationId: listWidgets
      responses:
        "200":
          description: Authenticated widget delivery channels.
          content: { application/json: { schema: { $ref: "#/components/schemas/WidgetList" } } }
    post:
      operationId: createWidget
      description: Creates a draft widget and returns its first server-only secret exactly once.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateWidgetRequest" } } } }
      responses:
        "201": { description: Widget and one-time secret., content: { application/json: { schema: { $ref: "#/components/schemas/WidgetProvisioning" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/widgets/{widget_id}:
    parameters:
      - { name: widget_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getWidget
      responses:
        "200": { description: Widget configuration., content: { application/json: { schema: { $ref: "#/components/schemas/Widget" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWidget
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateWidgetRequest" } } } }
      responses:
        "200": { description: Updated widget., content: { application/json: { schema: { $ref: "#/components/schemas/Widget" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/widgets/{widget_id}/activate:
    parameters:
      - { name: widget_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: activateWidget
      description: Requires at least one allowed origin, one active integration, and an enabled assistant LLM profile.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionRequest" } } } }
      responses:
        "200": { description: Active widget., content: { application/json: { schema: { $ref: "#/components/schemas/Widget" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/widgets/{widget_id}/disable:
    parameters:
      - { name: widget_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: disableWidget
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionRequest" } } } }
      responses:
        "200": { description: Disabled widget., content: { application/json: { schema: { $ref: "#/components/schemas/Widget" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/widgets/{widget_id}/secrets:
    parameters:
      - { name: widget_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listWidgetSecrets
      responses:
        "200": { description: Non-secret credential metadata., content: { application/json: { schema: { $ref: "#/components/schemas/WidgetSecretList" } } } }
    post:
      operationId: createWidgetSecret
      description: Returns a new server-only credential exactly once. Existing credentials remain active until explicitly revoked.
      responses:
        "201": { description: One-time secret and its metadata., content: { application/json: { schema: { $ref: "#/components/schemas/WidgetSecretProvisioning" } } } }
  /api/v1/widgets/{widget_id}/secrets/{secret_id}:
    parameters:
      - { name: widget_id, in: path, required: true, schema: { type: string } }
      - { name: secret_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeWidgetSecret
      responses:
        "200": { description: Revoked credential metadata., content: { application/json: { schema: { $ref: "#/components/schemas/WidgetSecret" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/widgets/{widget_id}/sessions:
    parameters:
      - { name: widget_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listWidgetSessions
      responses:
        "200": { description: Recent widget sessions without bearer material., content: { application/json: { schema: { $ref: "#/components/schemas/WidgetSessionList" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/widgets/{widget_id}/sessions/{session_id}:
    parameters:
      - { name: widget_id, in: path, required: true, schema: { type: string } }
      - { name: session_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeWidgetSession
      responses:
        "200": { description: Revoked widget session metadata., content: { application/json: { schema: { $ref: "#/components/schemas/WidgetSession" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /.well-known/oauth-authorization-server:
    get:
      security: []
      operationId: getOAuthAuthorizationServerMetadata
      description: RFC 8414-compatible authorization-server metadata for resource-bound Private MCP OAuth.
      responses:
        "200":
          description: Authorization-server metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthAuthorizationServerMetadata" }
  /.well-known/oauth-protected-resource/mcp:
    get:
      security: []
      operationId: getMCPProtectedResourceMetadata
      description: RFC 9728 protected-resource metadata for the singleton Deployment's Private MCP endpoint.
      responses:
        "200":
          description: Protected-resource metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthProtectedResourceMetadata" }
        "404": { $ref: "#/components/responses/Error" }
  /oauth/register:
    post:
      security: []
      operationId: registerOAuthClient
      description: Registers a public PKCE client under RFC 7591. Identical normalized metadata returns the same durable client identifier, making network retries safe. No client secret is issued.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthClientRegistrationRequest" }
      responses:
        "201":
          description: Idempotent public-client registration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClientRegistration" }
        "400": { $ref: "#/components/responses/OAuthError" }
        "404": { $ref: "#/components/responses/OAuthError" }
        "429": { $ref: "#/components/responses/OAuthRateLimit" }
        "503": { $ref: "#/components/responses/OAuthError" }
  /oauth/authorize:
    get:
      security: []
      operationId: oauthAuthorize
      description: Starts authorization-code OAuth using a registered public client or HTTPS client metadata document, mandatory RFC 8707 resource binding, PKCE S256, upstream vendor OIDC, and fail-closed access evaluation.
      parameters:
        - { name: response_type, in: query, required: true, schema: { const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string, description: Durable RFC 7591 client identifier or HTTPS URL of a client metadata document. } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: resource, in: query, required: true, schema: { type: string, format: uri, description: Exact Private MCP resource URL advertised by protected-resource metadata. } }
        - { name: scope, in: query, required: false, schema: { type: string, default: "mcp:private" } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { const: S256 } }
      responses:
        "302": { description: Redirect to the configured vendor IdP. }
        "400": { $ref: "#/components/responses/OAuthError" }
  /oauth/callback:
    get:
      security: []
      operationId: oauthCallback
      description: Verifies upstream state, nonce and ID token, resolves vendor access fail-closed, creates or resolves the durable customer account, then redirects with a one-time code.
      responses:
        "302": { description: Exact registered client redirect. }
        "401": { $ref: "#/components/responses/OAuthError" }
  /oauth/token:
    post:
      security: []
      operationId: oauthToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                grant_type: { const: authorization_code }
                code: { type: string }
                code_verifier: { type: string }
                client_id: { type: string }
                redirect_uri: { type: string, format: uri }
                resource: { type: string, format: uri }
              required: [grant_type, code, code_verifier, client_id, redirect_uri, resource]
      responses:
        "200":
          description: Short-lived opaque DokoSoko access token bound to the exact Private MCP resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthTokenResponse" }
        "400": { $ref: "#/components/responses/OAuthError" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /agent-setup/{kind}/prompt.md:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [public, private] }
    get:
      security: []
      operationId: getAgentSetupPrompt
      description: Secret-free, client-specific setup instructions derived from the canonical configured public origin. Public setup is unavailable while Public MCP is disabled; private setup is unavailable while customer identity is inactive.
      responses:
        "200":
          description: Setup prompt for Codex, Claude Code, Cursor, and OpenCode.
          content:
            text/markdown:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /mcp/public:
    parameters:
      - $ref: "#/components/parameters/MCPProtocolVersion"
      - $ref: "#/components/parameters/MCPMethod"
      - $ref: "#/components/parameters/MCPName"
    post:
      security: []
      operationId: publicDeploymentMCP
      description: Canonical authentication-free Stateless MCPv2 endpoint for the singleton Deployment. Available only while Public MCP is enabled.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JSONRPCRequest" } } }
      responses:
        "200": { description: JSON-RPC result., content: { application/json: { schema: { $ref: "#/components/schemas/JSONRPCResponse" } } } }
        "404": { description: Public MCP is disabled. }
        "429": { description: Anonymous request budget exceeded. }
  /mcp:
    parameters:
      - $ref: "#/components/parameters/MCPProtocolVersion"
      - $ref: "#/components/parameters/MCPMethod"
      - $ref: "#/components/parameters/MCPName"
    post:
      security: [{ dokoBearer: [] }]
      operationId: privateDeploymentMCP
      description: Canonical authenticated Stateless MCPv2 endpoint for the singleton Deployment.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JSONRPCRequest" } } }
      responses:
        "200": { description: JSON-RPC result., content: { application/json: { schema: { $ref: "#/components/schemas/JSONRPCResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dokosoko_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Administrator automation token in development only; production uses the root session cookie.
    setupToken:
      type: http
      scheme: bearer
      description: One-time deployment setup token.
    dokoBearer:
      type: http
      scheme: bearer
      description: Opaque, short-lived DokoSoko OAuth access token bound to one exact Private MCP resource.
  parameters:
    ProductID:
      name: product_id
      in: path
      required: true
      schema: { type: string }
    ProductVersionID:
      name: version_id
      in: path
      required: true
      schema: { type: string }
    OrganisationID:
      name: organisation_id
      in: path
      required: true
      schema: { type: string }
    SourceID:
      name: source_id
      in: path
      required: true
      schema: { type: string }
    MCPConnectionID:
      name: connection_id
      in: path
      required: true
      schema: { type: string }
    MCPProtocolVersion:
      name: MCP-Protocol-Version
      in: header
      required: true
      schema: { type: string, const: "2026-07-28" }
    MCPMethod:
      name: Mcp-Method
      in: header
      required: true
      description: Must exactly match the JSON-RPC method.
      schema: { type: string, enum: [server/discover, tools/list, tools/call] }
    MCPName:
      name: Mcp-Name
      in: header
      required: false
      description: Required for tools/call and must exactly match params.name.
      schema: { type: string }
  requestBodies:
    NamedResource:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
            required: [name, slug]
    RootInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              email: { type: string, format: email }
              display_name: { type: string, minLength: 1, maxLength: 120 }
              password: { type: string, format: password, minLength: 14 }
            required: [email, display_name, password]
    MFACompletion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              enrollment_id: { type: string }
              code: { type: string }
            required: [enrollment_id, code]
    Revision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              revision: { type: integer, format: int64, minimum: 1 }
            required: [revision]
    VisibilityChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              visibility: { $ref: "#/components/schemas/Visibility" }
              acknowledge_public: { type: boolean, default: false }
              revision: { type: integer, format: int64, minimum: 1 }
            required: [visibility, revision]
  responses:
    Error:
      description: Structured API error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    OAuthError:
      description: OAuth 2.0 error response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error: { type: string }
              error_description: { type: string }
            required: [error, error_description]
    OAuthRateLimit:
      description: OAuth client registration rate limit exceeded. Retrying after the advertised delay is safe.
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error: { const: temporarily_unavailable }
              error_description: { type: string }
            required: [error, error_description]
    MFAEnrollment:
      description: Short-lived MFA enrollment; the TOTP secret is returned only during enrollment.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MFAEnrollment" }
    AuthenticatedRoot:
      description: Authenticated root session. Recovery codes are returned only once when a root is created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              user: { $ref: "#/components/schemas/RootUser" }
              expires_at: { type: string, format: date-time }
              csrf_token: { type: string, description: Double-submit CSRF token also set in the dokosoko_csrf cookie. }
              recovery_codes: { type: array, items: { type: string } }
            required: [user]
    RootList:
      description: Root users without password, TOTP, or recovery-code material.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              items: { type: array, items: { $ref: "#/components/schemas/RootUser" } }
            required: [items]
    ConfirmationOrRevisionConflict:
      description: Public confirmation is required, or the supplied revision is stale.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    DeploymentInput:
      type: object
      properties:
        organisation_id: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        description: { type: string, maxLength: 2000 }
        default_release_policy: { type: string, enum: [latest, lts], default: latest }
        require_promotion_approval: { type: boolean }
        public_mcp_enabled: { type: boolean, default: false }
        revision: { type: integer, format: int64, minimum: 1 }
      required: [name, slug]
    Deployment:
