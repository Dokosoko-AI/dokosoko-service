  /api/v1/identity-provider:
    get:
      operationId: getIdentityProvider
      responses:
        '200':
          description: OIDC customer identity configuration, or an explicit unconfigured setup shape containing the exact callback URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProvider'
    put:
      operationId: replaceIdentityProvider
      description: Saves a disabled OIDC draft. State is server-controlled; every save creates a new revision and immediately invalidates OAuth artifacts bound to older revisions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceIdentityProviderRequest'
      responses:
        '200':
          description: Identity provider configuration saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProvider'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: disconnectIdentityProvider
      description: >-
        Permanently disconnects a disabled OIDC configuration at one exact revision. Deletes the provider config, client credential, provider tests, and product OAuth artifacts
        with their delegated bearer secrets. Customer accounts and append-only audit history are intentionally preserved. Disable first so runtime access stops as a separate
        explicit action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderRevisionRequest'
      responses:
        '200':
          description: Clean explicit unconfigured setup shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProvider'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/identity-provider/tests:
    post:
      operationId: beginIdentityProviderTest
      description: >-
        Runs discovery and starts a real OIDC authorization-code test for one exact saved configuration revision. Active configurations may be re-tested without interrupting
        access. The callback verifies the confidential client, ID-token signature, issuer, audience, nonce, and configured customer claim without evaluating access, creating a
        customer account, or retaining tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderRevisionRequest'
      responses:
        '201':
          description: >-
            Stored short-lived test transaction. Open authorization_url only when status is pending; discovery/setup failures are returned here as status failed with id and
            failure_code so the exact result remains inspectable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderTest'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
