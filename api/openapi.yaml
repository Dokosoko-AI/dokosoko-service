      description: Attaches either one exact reviewed collection revision or an explicit follow-latest policy; the API does not copy the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIDocumentationBindingInput'
      responses:
        '201':
          description: Documentation binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIDocumentationBinding'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/resources/documentation/{binding_id}:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
      - name: binding_id
        in: path
        required: true
