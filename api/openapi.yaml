    CredentialFreeHTTPSOrLocalhostHTTPURI:
      type: string
      format: uri
      maxLength: 2048
      pattern: ^(?:https://[^/?#@]+|http://(?:(?:[A-Za-z0-9-]+\.)*[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|127\.0\.0\.1|\[::1\])(?::[0-9]{1,5})?)(?:/[^?#]*)?$
      description: >-
        HTTPS URI without userinfo, a query, or a fragment. HTTP is accepted only for localhost, localhost subdomains, 127.0.0.1, or ::1 local-development hosts. These common
        credential channels are rejected, but the path is not secret-scanned and must not contain credentials.
    RuntimeAuthenticationType:
      type: string
      enum:
        - none
        - delegated_oauth
        - bearer
        - authorization_scheme
        - api_key_header
        - api_key_query
        - basic
        - oauth_client_credentials
        - custom_header
      description: Vendor-neutral upstream authentication mode for one service-connection revision.
    RuntimeCredentialAuthenticationType:
      type: string
      enum:
        - bearer
        - authorization_scheme
        - api_key_header
        - api_key_query
        - basic
        - oauth_client_credentials
        - custom_header
      description: Upstream authentication mode that requires an encrypted runtime credential set.
    RuntimeAuthenticationConfiguration:
      type: object
      additionalProperties: false
      description: >-
        Non-secret structural authentication settings. Only fields applicable to the selected authentication type are accepted; credential values belong exclusively in write-only
        request fields.
      properties:
        scheme:
          type: string
          minLength: 1
          maxLength: 120
        query_name:
          type: string
          minLength: 1
          maxLength: 120
        username:
          type: string
          minLength: 1
          maxLength: 500
        client_id:
          type: string
          minLength: 1
          maxLength: 500
        token_url:
          $ref: '#/components/schemas/CredentialFreeHTTPSOrLocalhostHTTPURI'
        token_endpoint_auth_method:
          type: string
          enum:
            - client_secret_basic
            - client_secret_post
        scopes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
          maxItems: 100
          uniqueItems: true
        audience:
          type: string
          minLength: 1
          maxLength: 1000
        resource:
          type: string
          minLength: 1
          maxLength: 1000
        prefix:
          type: string
          maxLength: 120
    RuntimeServiceConnectionRevision:
      type: object
      additionalProperties: false
      description: Immutable, environment-specific runtime destination and authentication configuration. It references credential metadata by ID and contains no credential or vault material.
      properties:
