      required:
        - role
        - content
    ToolTestAnalysisRequest:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Must equal both the exact run revision and current exact base revision.
        evidence_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: Browser/server consent-binding token recomputed over this exact run. It is enforced by the server and never sent to the Analysis provider.
        consent_to_analysis_provider:
          type: boolean
          const: true
          description: Must be explicitly present and true before the configured Analysis provider is contacted.
        question:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Latest non-secret question limited to 2,048 UTF-8 bytes after trimming. Credential-like material,
            destination URLs, nonce-shaped material, and UUID-shaped internal identifiers are rejected.
        history:
          type: array
          maxItems: 12
          description: >-
            Chronological untrusted user/assistant context. Combined role/content data is limited to 12,288 UTF-8 bytes, rejected when credential-like or containing a destination
            URL, nonce-shaped material, or UUID-shaped internal identifier, and never persisted as tool state.
