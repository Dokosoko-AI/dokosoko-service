          type: string
    get:
      operationId: getAPIDocumentationBinding
      tags: ["API Resources"]
      responses:
        '200':
          description: Documentation binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIDocumentationBinding'
    patch:
      operationId: changeAPIDocumentationBinding
      tags: ["API Resources"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIDocumentationBindingInput'
      responses:
        '200':
          description: Revised attachment; it does not revise the collection.
          content:
            application/json:
