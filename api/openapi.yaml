        schema:
          type: string
    post:
      tags: ["Recipes and Analysis"]
      operationId: generateRecipes
      description: >-
        Creates review-state Markdown recipes synchronously. Supply the same integration_id used to create a scoped analysis; cross-integration generation is rejected.
