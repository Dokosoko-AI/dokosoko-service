    get:
      operationId: reviewSourceGeneration
      description: Returns one exact crawl generation, including changed and reused immutable documents, injection findings, and any publication already created from it.
      responses:
        '200':
          description: Exact source review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceReview'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/products/{product_id}/sources/{source_id}/publications:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - $ref: '#/components/parameters/SourceID'
    get:
      operationId: listSourcePublications
      description: Lists immutable reviewed source publications, newest revision first.
      responses:
        '200':
          description: Reviewed source publications.
          content:
            application/json:
