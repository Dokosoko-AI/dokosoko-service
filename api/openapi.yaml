    ReplaceToolDraftRequest:
      type: object
      additionalProperties: false
      description: >-
        Full replacement contract for a draft. The common fields are required for both HTTP-backed and managed MCP-backed tools. Endpoint and HTTP method are additionally required
        for HTTP-backed tools. HTTP connection fields omitted from the request preserve their current values. Managed MCP-backed tools preserve and ignore HTTP connection fields.
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
