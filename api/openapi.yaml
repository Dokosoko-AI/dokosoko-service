        - revision
        - created_at
        - updated_at
    RuntimeCredentialVersion:
      type: object
      additionalProperties: false
      description: Credential lifecycle metadata only. The encrypted value and its internal vault reference are intentionally outside the API contract.
      properties:
        id:
          type: string
        authorization_id:
          type: string
