    SDKSampleValidationEvidence:
      type: object
      additionalProperties: true
      description: >-
        Server-owned evidence for a non-executing parse or conservative static check. A status label alone is not approval evidence;
        validated=true (or legacy passed=true) and a named validator or evidence_id are required for positive machine evidence.
        Historical samples may expose an empty object; clients must treat missing evidence fields as not checked.
      properties:
        schema_version:
          type: string
        language:
          type: string
        validated:
          type: boolean
        passed:
          type: boolean
          description: Legacy positive-result field accepted only when paired with a named validator or evidence_id.
        result:
          type: string
          enum:
            - passed
            - not_checked
        validator:
          type: string
        evidence_id:
          type: string
        check_kind:
          type: string
          enum:
            - parse_only
            - conservative_structure
            - unsupported
            - none
        complete_file:
          type: boolean
        parse_context:
          type: string
          description: Real parser context used for a validated Go file or conservative snippet wrapper.
          enum:
            - file
            - declarations
            - statements
            - expression
        structure_passed:
          type: boolean
          description: Advisory-only result for languages without an in-process grammar parser; never positive machine evidence.
        no_execution:
          type: boolean
          const: true
        no_dependency_install:
          type: boolean
          const: true
        no_dependency_loading:
          type: boolean
          const: true
        reason:
          type: string
    SDKSampleReviewEvidence:
      type: object
      additionalProperties: true
      description: Explicit structured human evidence required to approve a sample without positive machine validation evidence.
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 4000
        method:
          type: string
        reference:
          type: string
      required:
        - summary
