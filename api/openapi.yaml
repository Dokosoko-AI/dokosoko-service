                $ref: '#/components/schemas/APIDeveloperAssetPublication'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/resources/documentation:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
    post:
      operationId: attachAPIDocumentation
