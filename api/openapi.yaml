    ReplaceIdentityProviderRequest:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          const: oidc
          description: Explicit fixed provider discriminator for standards-based OpenID Connect.
        issuer:
          type: string
          format: uri
          description: >-
            Exact HTTPS OIDC issuer, including any path, port, or trailing slash. HTTP is accepted only for
            localhost development.
        client_id:
          type: string
          minLength: 1
        client_secret:
          type: string
          format: password
          writeOnly: true
          description: Required for initial configuration; omit or send empty to retain the current encrypted secret.
        scopes:
          type: array
          items:
            type: string
          default:
            - openid
            - profile
            - email
        audience:
          type: string
          description: Optional provider-specific authorization-request audience. Omitted upstream when empty.
        oauth_resource:
          type: string
          format: uri
          description: Optional absolute RFC 8707 resource identifier sent to the upstream authorization server; independent of the authorization API origin and not dereferenced by DokoSoko.
        customer_account_claim:
          type: string
          minLength: 1
          description: Required string ID-token claim that identifies the customer account; no implicit claim is assumed.
        installation_claim:
          type: string
          description: Optional trusted OIDC claim matched to a registered product installation.
        authorization_api_origin:
          description: >-
            Credential-free HTTPS origin used only with the delegated user token. Loopback and *.localhost HTTP origins with explicit ports are accepted only for local development.
            DokoSoko appends the normative access-evaluation path and rejects customer tool endpoints on other origins.
          type: string
          format: uri
        revision:
          type: integer
          format: int64
          minimum: 0
      required:
        - provider
        - issuer
        - client_id
        - customer_account_claim
        - authorization_api_origin
        - revision
