    DeveloperAssetQueryLabInput:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum:
            - global
            - api
            - combined
          description: Defaults to global without api_id and combined with api_id.
        api_id:
          type: string
        deployment_documentation_publication_id:
          type: string
          description: Exact immutable global scope. If omitted, the active global publication is resolved and recorded.
        api_developer_asset_publication_id:
          type: string
          description: Exact immutable API scope; must belong to api_id or the request is rejected.
        query:
          type: string
          minLength: 1
          maxLength: 500
        asset_kinds:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - documentation
              - contract
              - sdk
        languages:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
        ecosystems:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
        sdk_release_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
        exact_versions:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        context_token_limit:
          type: integer
          minimum: 256
          maximum: 32000
          default: 4000
      required:
        - query
    DeveloperAssetCitation:
      type: object
      additionalProperties: true
      description: Immutable source publication, entity, path/anchor, content hash, exact SDK version, or reviewed-map citation needed to verify a retrieved result.
    DeveloperAssetKnowledgeUnit:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        unit_kind:
          type: string
        source_publication_kind:
          type: string
        source_publication_id:
          type: string
        source_entity_id:
          type: string
        title:
          type: string
        breadcrumb:
          type: array
          items:
            type: string
        content:
          type: string
        language:
          type: string
        ecosystem:
          type: string
        identifiers:
          type: array
          items:
            type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        citation:
          $ref: '#/components/schemas/DeveloperAssetCitation'
        metadata:
          type: object
          additionalProperties: true
        content_hash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
      required:
        - id
        - unit_kind
        - source_publication_kind
        - source_publication_id
        - source_entity_id
        - breadcrumb
        - content
        - identifiers
        - visibility
        - citation
        - metadata
        - content_hash
    DeveloperAssetQueryLabResult:
      type: object
      additionalProperties: false
      properties:
        rank:
          type: integer
          minimum: 1
        unit:
          $ref: '#/components/schemas/DeveloperAssetKnowledgeUnit'
        excerpt:
          type: string
        lexical_score:
          type: number
        semantic_score:
          type: number
          description: Compatibility field containing the local-feature-hash-v1 cosine score. It is a deterministic lexical feature-hash signal, not a learned semantic embedding.
        rerank_score:
          type: number
        selected:
          type: boolean
          const: true
      required:
        - rank
        - unit
        - excerpt
        - lexical_score
        - semantic_score
        - rerank_score
        - selected
