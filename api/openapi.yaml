  /api/v1/integrations/{integration_id}/resources/sdks:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
    post:
      operationId: attachAPISDKRelease
      tags: ["API Resources"]
      description: >-
        Attaches one deployment-owned package and one exact release ID. The binding never follows latest and never auto-upgrades; compatibility assurance and selectors are explicit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APISDKBindingInput'
            examples:
              exactPrivateRelease:
                value:
                  sdk_package_id: sdk-package-123
                  sdk_release_id: sdk-release-1-4-0
                  state: draft
                  coverage: partial
                  assurance: documented
                  applicable_modules:
                    - payments
                  applicable_capabilities:
                    - create_payment
                  selector: {}
                  visibility: private
      responses:
        '201':
          description: Exact SDK release binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APISDKBinding'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/resources/sdks/{binding_id}:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
      - name: binding_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAPISDKBinding
      tags: ["API Resources"]
      responses:
        '200':
          description: Exact SDK release binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APISDKBinding'
    patch:
      operationId: changeAPISDKBinding
      tags: ["API Resources"]
      description: Changes the binding explicitly. Selecting another exact release is a revisioned human action, never an automatic upgrade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APISDKBindingInput'
      responses:
        '200':
          description: Revised SDK attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APISDKBinding'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: detachAPISDKRelease
      tags: ["API Resources"]
      requestBody:
        $ref: '#/components/requestBodies/Revision'
      responses:
        '200':
          description: Detached SDK binding retained for audit history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APISDKBinding'
  /api/v1/developer-assets/ai-advisories:
    get:
      operationId: listDeveloperAssetAIAdvisories
      tags: ["Advisory AI"]
      description: >-
        Lists immutable advisory artifacts for the current deployment. This persistence-only route remains available when the Analysis AI workload is disabled or unconfigured.
      parameters:
        - name: prompt_key
          in: query
          schema:
            $ref: '#/components/schemas/DeveloperAssetAIAdvisoryPromptKey'
        - name: scope_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Immutable advisory artifacts, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperAssetAIAdvisoryRunList'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    post:
      operationId: runDeveloperAssetAIAdvisory
      tags: ["Advisory AI"]
      description: >-
        Runs one closed, advisory-only AI workflow over exact immutable reviewed publication evidence. The result never mutates maps, bindings, samples, visibility, indexes, approvals, or publication state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeveloperAssetAIAdvisoryInput'
      responses:
        '201':
          description: Newly persisted advisory, or the immutable artifact for the same deterministic input identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperAssetAIAdvisoryRun'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/developer-assets/ai-advisories/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDeveloperAssetAIAdvisory
      tags: ["Advisory AI"]
      description: Reads one immutable, deployment-scoped advisory artifact without requiring an AI provider connection.
      responses:
        '200':
          description: Immutable advisory artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperAssetAIAdvisoryRun'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/developer-assets/query-lab:
    post:
      operationId: runDeveloperAssetQueryLab
      tags: ["Query and Traces"]
      description: >-
        Runs bounded hybrid retrieval only over an exact published global, API, or combined scope. Cross-API publication IDs are rejected; every result carries immutable source identity, hashes, and citation metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeveloperAssetQueryLabInput'
            examples:
              exactAPIAndGlobalScope:
                value:
                  scope: combined
                  api_id: api-payments-v1
                  deployment_documentation_publication_id: global-docs-revision-7
                  api_developer_asset_publication_id: api-assets-payments-v1-revision-3
                  query: How do I authenticate the JavaScript SDK?
                  asset_kinds:
                    - documentation
                    - sdk
                  exact_versions:
                    - 1.4.0
                  limit: 10
                  context_token_limit: 4000
      responses:
        '200':
          description: Ranked published knowledge plus a durable trace ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperAssetQueryLabResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/developer-assets/query-lab/traces:
    get:
      operationId: listDeveloperAssetQueryTraces
      tags: ["Query and Traces"]
      description: Lists bounded, deployment-scoped retrieval traces for review and citation debugging.
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Retrieval traces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalQueryTraceList'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/developer-assets/query-lab/traces/{trace_id}:
    parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDeveloperAssetQueryTrace
      tags: ["Query and Traces"]
      description: Reads the requested filters, resolved immutable publication scope, routing diagnostics, ranked citations, and exclusions for one query.
      responses:
        '200':
          description: Retrieval trace and ranked trace results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalQueryTraceRecord'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/sdks:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
    get:
      operationId: listIntegrationSDKReferences
      tags: ["SDK Catalog"]
      deprecated: true
      description: >-
        Compatibility projection of the API's typed SDK bindings. New clients use /integrations/{integration_id}/resources and the deployment-owned SDK package/release catalog; this projection never creates an independently owned or auto-upgrading release.
      responses:
        '200':
          description: Exact SDK references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDKReferenceList'
    post:
      operationId: createIntegrationSDKReference
      tags: ["SDK Catalog"]
      deprecated: true
      description: Removed compatibility mutation. Manage deployment-owned packages and exact releases in SDK Catalog, then attach them through API Resources.
      responses:
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/integrations/{integration_id}/sdks/{sdk_id}:
    parameters:
      - $ref: '#/components/parameters/IntegrationID'
      - name: sdk_id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: replaceIntegrationSDKReference
      tags: ["SDK Catalog"]
      deprecated: true
      description: Removed compatibility mutation. Change the deployment-owned release or the typed API Resources binding explicitly.
      responses:
        '410':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteIntegrationSDKReference
      tags: ["SDK Catalog"]
      deprecated: true
      description: Removed compatibility mutation. Detach the typed API Resources SDK binding to retain its audit history.
      responses:
        '410':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dokosoko_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Administrator automation token in development only; production uses the root session cookie.
    setupToken:
      type: http
      scheme: bearer
      description: One-time deployment setup token.
    dokoBearer:
      type: http
      scheme: bearer
      description: Opaque, short-lived DokoSoko OAuth access token bound to one exact Private MCP resource.
  parameters:
    ProductID:
      name: product_id
      in: path
      required: true
      schema:
        type: string
    OrganisationID:
      name: organisation_id
      in: path
      required: true
      schema:
        type: string
    SourceID:
      name: source_id
      in: path
      required: true
      schema:
        type: string
    MCPConnectionID:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
    MCPProtocolVersion:
      name: MCP-Protocol-Version
      in: header
      required: true
      schema:
        type: string
        const: '2026-07-28'
    MCPMethod:
      name: Mcp-Method
      in: header
      required: true
      description: Must exactly match the JSON-RPC method.
      schema:
        type: string
        enum:
          - server/discover
          - tools/list
          - tools/call
    MCPName:
      name: Mcp-Name
      in: header
      required: false
      description: Required for tools/call and must exactly match params.name.
      schema:
        type: string
    IntegrationID:
      name: integration_id
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    NamedResource:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 120
              slug:
                type: string
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            required:
              - name
              - slug
    RootInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              email:
                type: string
                format: email
              display_name:
                type: string
                minLength: 1
                maxLength: 120
              password:
                type: string
                format: password
                minLength: 14
            required:
              - email
              - display_name
              - password
    MFACompletion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              enrollment_id:
                type: string
              code:
                type: string
            required:
              - enrollment_id
              - code
    Revision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              revision:
                type: integer
                format: int64
                minimum: 1
            required:
              - revision
    SourcePublication:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              revision:
                type: integer
                format: int64
                minimum: 1
              crawl_job_id:
                type: string
                minLength: 1
              document_ids:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
              acknowledge_reviewed:
                type: boolean
                const: true
            required:
              - revision
              - crawl_job_id
              - document_ids
              - acknowledge_reviewed
    VisibilityChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              visibility:
                $ref: '#/components/schemas/Visibility'
              acknowledge_public:
                type: boolean
                default: false
              revision:
                type: integer
                format: int64
                minimum: 1
            required:
              - visibility
              - revision
  responses:
    Error:
      description: Structured API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OAuthError:
      description: OAuth 2.0 error response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                type: string
              error_description:
                type: string
            required:
              - error
              - error_description
    OAuthRateLimit:
      description: OAuth client registration rate limit exceeded. Retrying after the advertised delay is safe.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                const: temporarily_unavailable
              error_description:
                type: string
            required:
              - error
              - error_description
    MFAEnrollment:
      description: Short-lived MFA enrollment; the TOTP secret is returned only during enrollment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFAEnrollment'
    AuthenticatedRoot:
      description: Authenticated root session. Recovery codes are returned only once when a root is created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              user:
                $ref: '#/components/schemas/RootUser'
              expires_at:
                type: string
                format: date-time
              csrf_token:
                type: string
                description: Double-submit CSRF token also set in the dokosoko_csrf cookie.
              recovery_codes:
                type: array
                items:
                  type: string
            required:
              - user
    RootList:
      description: Root users without password, TOTP, or recovery-code material.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/RootUser'
            required:
              - items
    ConfirmationOrRevisionConflict:
      description: Public confirmation is required, or the supplied revision is stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    DeploymentInput:
      type: object
      properties:
        organisation_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description:
          type: string
          maxLength: 2000
        feedback_submission_url:
          $ref: '#/components/schemas/OptionalRuntimeOutboundURI'
          description: Optional deployment-wide destination for feedback submissions. Empty disables delivery.
        error_submission_url:
          $ref: '#/components/schemas/OptionalRuntimeOutboundURI'
          description: Optional deployment-wide destination for error submissions. Empty disables delivery.
        public_mcp_enabled:
          type: boolean
          default: false
        revision:
          type: integer
          format: int64
          minimum: 1
      required:
        - name
        - slug
    Deployment:
      allOf:
        - $ref: '#/components/schemas/DeploymentInput'
        - type: object
          properties:
            id:
              type: string
            organisation_id:
              type: string
            catalog_revision:
              type: integer
              format: int64
              minimum: 1
            revision:
              type: integer
              format: int64
              minimum: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
          required:
            - id
            - organisation_id
            - feedback_submission_url
            - error_submission_url
            - catalog_revision
            - revision
            - created_at
            - updated_at
    CreateIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        family_key:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        version_key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        visibility:
          type: string
          enum:
            - private
            - public
          default: private
          description: Public Integrations appear on the unauthenticated read-only MCP surface.
        acknowledge_public:
          type: boolean
          default: false
          description: Must be true when visibility is public.
        lifecycle:
          type: string
          enum:
            - draft
            - active
            - deprecated
            - retired
        replacement_integration_id:
          type: string
        sunset_at:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - family_key
        - version_key
        - display_name
    ReplaceIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        family_key:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        version_key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        visibility:
          type: string
          enum:
            - private
            - public
        acknowledge_public:
          type: boolean
          default: false
        lifecycle:
          type: string
          enum:
            - draft
            - active
            - deprecated
            - retired
        replacement_integration_id:
          type: string
        sunset_at:
          type:
            - string
            - 'null'
          format: date-time
        revision:
          type: integer
          format: int64
          minimum: 1
      required:
        - family_key
        - version_key
        - display_name
        - description
        - visibility
        - lifecycle
        - revision
    ResourceSetRevision:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Present only after a configuration has been saved.
        resource_set_id:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 1
        manifest:
          type: array
          items: {}
        content_hash:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - resource_set_id
        - revision
        - manifest
        - content_hash
        - created_at
    IntegrationResourceLink:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        integration_id:
          type: string
        resource_set_id:
          type: string
        kind:
          type: string
          enum:
            - documentation
            - api
        name:
          type: string
        follow_latest:
          type: boolean
        pinned_revision_id:
          type: string
        resolved_revision:
          $ref: '#/components/schemas/ResourceSetRevision'
        created_at:
          type: string
          format: date-time
