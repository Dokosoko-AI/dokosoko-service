openapi: 3.1.0
info:
  title: DokoSoko Access Provider Operations
  version: 2026-08-20
  description: >-
    Reference HTTPS operations for a DokoSoko Access Definition. The vendor,
    not the end user, declares whether its service has one fixed instance or
    supports many provider-owned resources. Operation paths are configurable;
    these /v1 paths are recommended defaults. DokoSoko authenticates with a
    separate encrypted management credential, authorizes before every
    mutation, validates destinations, and fails closed.
servers:
  - url: https://api.vendor.example.com
security:
  - serviceBearer: []
tags:
  - name: Authorization
    description: Independent fail-closed authorization for every mutation.
  - name: Instances
    description: Optional provider-owned resource lifecycle for multi-instance services.
  - name: Credentials
    description: Connection- or instance-scoped issuance and explicit revocation.
x-dokosoko-access-definition:
  service_key: vendor-service
  instance_cardinality: many
  instance_label_singular: Project
  instance_label_plural: Projects
  credential_scope: instance
  management_auth_type: bearer
  required_entitlements: [developer.pro]
  max_ttl_seconds: 3600
  credential_storage_mode: one_time
  operations:
    authorize: { method: POST, path: /v1/authorize }
    instances.create: { method: POST, path: /v1/instances }
    credentials.create: { method: POST, path: /v1/credentials }
    credentials.revoke: { method: POST, path: "/v1/credentials/{credential_id}/revoke" }
paths:
  /v1/authorize:
    post:
      tags: [Authorization]
      operationId: authorizeAccessOperation
      summary: Authorize one access operation
      description: >-
        Decide whether the canonical subject may perform the requested
        operation. For a single-instance definition omit instances.create from
        the definition; DokoSoko will not expose or call it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizationRequest" }
            example:
              operation: credentials.create
              subject: https://id.vendor.example.com|user_123
              vendor_organisation_id: customer_42
              installation_id: install_01
              deployment_id: 2e543682-2766-4f00-8e3b-23487ad18bd5
              details:
                integration_id: bcb7d33a-b99e-4973-9ee4-bf69c626c326
                environment_id: 86b0c5b8-5748-4ac0-867d-204beb5c7220
                access_instance_id: 63c1a375-7a44-42d6-9275-9449bb34f2f2
                scopes: [voice.read, voice.write]
                ttl_seconds: 3600
      responses:
        "200":
          description: Explicit authorization decision.
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthorizationDecision" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/instances:
    post:
      tags: [Instances]
      operationId: createAccessInstance
      summary: Create or return an idempotent provider resource
      description: >-
        Used only when instance_cardinality is many. The vendor may call the
        resource a project, tenant, workspace, account, or another label in its
        Access Definition. Repeating an idempotency key returns the same resource.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateInstanceRequest" } } }
      responses:
        "200": { description: Existing resource returned for an idempotent replay., content: { application/json: { schema: { $ref: "#/components/schemas/InstanceResponse" } } } }
        "201": { description: Provider resource created., content: { application/json: { schema: { $ref: "#/components/schemas/InstanceResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/credentials:
    post:
      tags: [Credentials]
      operationId: createAccessCredential
      summary: Issue connection- or instance-scoped credentials
      description: >-
        access_instance_id is required for instance-scoped definitions and
        omitted for connection-scoped definitions. In one_time mode credential
        material is returned once and never returned for an idempotent replay.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateCredentialRequest" } } }
      responses:
        "201": { description: Credential issued., content: { application/json: { schema: { $ref: "#/components/schemas/CredentialResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: Idempotency key already consumed; plaintext is not returned again., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /v1/credentials/{credential_id}/revoke:
    parameters:
      - name: credential_id
        in: path
        required: true
        description: Vendor credential identifier returned during issuance.
        schema: { type: string, minLength: 1 }
    post:
      tags: [Credentials]
      operationId: revokeAccessCredential
      summary: Revoke a credential
      description: Revocation is idempotent; revoking an already revoked credential succeeds.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RevokeCredentialRequest" } } }
      responses:
        "204": { description: Credential revoked or already revoked. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Vendor-issued management credential stored encrypted by DokoSoko.
  responses:
    Error:
      description: Structured provider error without secret material.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    Operation:
      type: string
      enum: [instances.create, credentials.create, credentials.revoke]
    AuthorizationDetails:
      type: object
      additionalProperties: false
      properties:
        integration_id: { type: string }
        environment_id: { type: string }
        access_instance_id: { type: string }
        credential_id: { type: string }
        scopes: { type: array, maxItems: 20, items: { type: string } }
        ttl_seconds: { type: integer, minimum: 0, maximum: 31536000 }
    AuthorizationRequest:
      type: object
      additionalProperties: false
      properties:
        operation: { $ref: "#/components/schemas/Operation" }
        subject: { type: string, minLength: 1, description: Stable issuer-qualified vendor subject. }
        vendor_organisation_id: { type: string }
        installation_id: { type: string }
        deployment_id: { type: string, minLength: 1 }
        details: { $ref: "#/components/schemas/AuthorizationDetails" }
      required: [operation, subject, deployment_id, details]
    AuthorizationDecision:
      type: object
      additionalProperties: false
      properties:
        allowed: { type: boolean }
        reason: { type: string, maxLength: 500, description: Operator-safe reason; never include secrets. }
      required: [allowed]
    Owner:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [user, installation, organisation] }
        id: { type: string, minLength: 1 }
      required: [type, id]
    CreateInstanceRequest:
      type: object
      additionalProperties: false
      properties:
        deployment_id: { type: string, minLength: 1 }
        integration_id: { type: string, minLength: 1 }
        environment_id: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        owner: { $ref: "#/components/schemas/Owner" }
        idempotency_key: { type: string, minLength: 16, maxLength: 200 }
        ttl_seconds: { type: integer, minimum: 0, maximum: 31536000 }
      required: [deployment_id, integration_id, environment_id, display_name, owner, idempotency_key]
    InstanceResponse:
      type: object
      additionalProperties: false
      properties:
        instance_id: { type: string, minLength: 1 }
        external_id: { type: string }
        display_name: { type: string }
        state: { type: string, default: active }
        provider_metadata: { type: object, additionalProperties: true }
        expires_at: { type: [string, "null"], format: date-time }
      anyOf:
        - required: [instance_id]
        - required: [external_id]
    CreateCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        deployment_id: { type: string, minLength: 1 }
        integration_id: { type: string, minLength: 1 }
        environment_id: { type: string, minLength: 1 }
        access_instance_id: { type: string }
        subject: { type: string, minLength: 1 }
        scopes: { type: array, maxItems: 20, uniqueItems: true, items: { type: string } }
        idempotency_key: { type: string, minLength: 16, maxLength: 200 }
        ttl_seconds: { type: integer, minimum: 0, maximum: 31536000 }
      required: [deployment_id, integration_id, environment_id, subject, scopes, idempotency_key]
    CredentialResponse:
      type: object
      additionalProperties: false
      properties:
        credential: { type: string, minLength: 1, readOnly: true }
        credential_id: { type: string, minLength: 1 }
        credential_material:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          readOnly: true
        expires_at: { type: [string, "null"], format: date-time }
      required: [credential_id]
    RevokeCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        deployment_id: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1 }
      required: [deployment_id, subject]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean, default: false }
            request_id: { type: string }
          required: [code, message]
      required: [error]
