name: dokosoko-service

services:
  dokosoko:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOKOSOKO_CONFIG_FILE: ${DOKOSOKO_CONFIG_FILE:-}
      DOKOSOKO_DATABASE_URL: postgres://dokosoko:${DOKOSOKO_DATABASE_PASSWORD:?set DOKOSOKO_DATABASE_PASSWORD}@postgres:5432/dokosoko?sslmode=disable
      DOKOSOKO_MASTER_KEY: ${DOKOSOKO_MASTER_KEY:-}
      DOKOSOKO_PUBLIC_URL: ${DOKOSOKO_PUBLIC_URL:-http://localhost:8080}
      DOKOSOKO_SETUP_TOKEN: ${DOKOSOKO_SETUP_TOKEN:-}
      DOKOSOKO_AI_PROVIDER: ${DOKOSOKO_AI_PROVIDER:-}
      DOKOSOKO_AI_API_KEY: ${DOKOSOKO_AI_API_KEY:-}
      DOKOSOKO_AI_ENDPOINT: ${DOKOSOKO_AI_ENDPOINT:-}
      DOKOSOKO_AI_MODEL_ANALYSIS: ${DOKOSOKO_AI_MODEL_ANALYSIS:-}
      DOKOSOKO_AI_MAX_INPUT_TOKENS: ${DOKOSOKO_AI_MAX_INPUT_TOKENS:-}
      DOKOSOKO_AI_MAX_OUTPUT_TOKENS: ${DOKOSOKO_AI_MAX_OUTPUT_TOKENS:-}
      DOKOSOKO_AI_DAILY_TOKEN_BUDGET: ${DOKOSOKO_AI_DAILY_TOKEN_BUDGET:-}
      DOKOSOKO_ORGANISATION_NAME: ${DOKOSOKO_ORGANISATION_NAME:-}
      DOKOSOKO_ORGANISATION_SLUG: ${DOKOSOKO_ORGANISATION_SLUG:-}
      DOKOSOKO_DEPLOYMENT_NAME: ${DOKOSOKO_DEPLOYMENT_NAME:-}
      DOKOSOKO_DEPLOYMENT_SLUG: ${DOKOSOKO_DEPLOYMENT_SLUG:-}
      DOKOSOKO_DEPLOYMENT_DESCRIPTION: ${DOKOSOKO_DEPLOYMENT_DESCRIPTION:-}
      DOKOSOKO_DEPLOYMENT_FEEDBACK_SUBMISSION_URL: ${DOKOSOKO_DEPLOYMENT_FEEDBACK_SUBMISSION_URL:-}
      DOKOSOKO_DEPLOYMENT_ERROR_SUBMISSION_URL: ${DOKOSOKO_DEPLOYMENT_ERROR_SUBMISSION_URL:-}
      DOKOSOKO_UPLOAD_DIR: /uploads
      DOKOSOKO_UPLOAD_MAX_BYTES: ${DOKOSOKO_UPLOAD_MAX_BYTES:-5000000}
      DOKOSOKO_CRAWLER_MAX_PAGES: ${DOKOSOKO_CRAWLER_MAX_PAGES:-500}
      DOKOSOKO_CRAWLER_MAX_BYTES: ${DOKOSOKO_CRAWLER_MAX_BYTES:-5000000}
      DOKOSOKO_CRAWLER_ALLOW_LOCALHOST_SUBDOMAINS: ${DOKOSOKO_CRAWLER_ALLOW_LOCALHOST_SUBDOMAINS:-false}
      DOKOSOKO_CRAWLER_LOCALHOST_PORTS: ${DOKOSOKO_CRAWLER_LOCALHOST_PORTS:-80,443}
      DOKOSOKO_TOOL_LOCALHOST_HOSTS: ${DOKOSOKO_TOOL_LOCALHOST_HOSTS:-api.your-service.localhost:8080}
    ports:
      - "8080:8080"
    extra_hosts:
      - "${DOKOSOKO_CRAWLER_LOCALHOST_HOST:-api.your-service.localhost}:host-gateway"
    volumes:
      - dokosoko-data:/data
      - dokosoko-uploads:/uploads
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    environment:
      DOKOSOKO_CONFIG_FILE: ${DOKOSOKO_CONFIG_FILE:-}
      DOKOSOKO_DATABASE_URL: postgres://dokosoko:${DOKOSOKO_DATABASE_PASSWORD:?set DOKOSOKO_DATABASE_PASSWORD}@postgres:5432/dokosoko?sslmode=disable
      DOKOSOKO_DATA_DIR: /data
      DOKOSOKO_UPLOAD_DIR: /uploads
      DOKOSOKO_CRAWLER_MAX_PAGES: ${DOKOSOKO_CRAWLER_MAX_PAGES:-500}
      DOKOSOKO_CRAWLER_MAX_BYTES: ${DOKOSOKO_CRAWLER_MAX_BYTES:-5000000}
      DOKOSOKO_CRAWLER_ALLOW_LOCALHOST_SUBDOMAINS: ${DOKOSOKO_CRAWLER_ALLOW_LOCALHOST_SUBDOMAINS:-false}
      DOKOSOKO_CRAWLER_LOCALHOST_PORTS: ${DOKOSOKO_CRAWLER_LOCALHOST_PORTS:-80,443}
    volumes:
      - dokosoko-data:/data
      - dokosoko-uploads:/uploads:ro
    extra_hosts:
      - "${DOKOSOKO_CRAWLER_LOCALHOST_HOST:-api.your-service.localhost}:host-gateway"
    depends_on:
      dokosoko:
        condition: service_healthy
      postgres:
        condition: service_healthy
    shm_size: 256mb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: dokosoko
      POSTGRES_USER: dokosoko
      POSTGRES_PASSWORD: ${DOKOSOKO_DATABASE_PASSWORD:?set DOKOSOKO_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokosoko -d dokosoko"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  dokosoko-data:
  dokosoko-uploads:
  postgres-data:
