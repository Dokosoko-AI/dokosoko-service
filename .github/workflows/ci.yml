name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Console and crawler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:console
      - run: pnpm run test:crawler

  backend:
    name: Go and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: dokosoko_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dokosoko_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOKOSOKO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dokosoko_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  containers:
    name: Container contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          DOKOSOKO_DATABASE_PASSWORD: ci-database-password
          DOKOSOKO_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DOKOSOKO_SETUP_TOKEN: ci-setup-token-with-sufficient-length
        run: docker compose config --quiet
      - name: Build service image
        run: docker build --tag dokosoko-service:ci .
      - name: Build crawler image
        run: docker build --file Dockerfile.crawler --tag dokosoko-crawler:ci .
