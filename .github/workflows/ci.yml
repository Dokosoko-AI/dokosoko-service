name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Console and crawler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:console
      - run: pnpm run test:crawler

  backend:
    name: Go and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: dokosoko_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dokosoko_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOKOSOKO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dokosoko_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Check reachable Go vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
      - name: Test standalone MCP acceptance client
        working-directory: examples/mcp-acceptance-client
        run: go test ./...

  terraform:
    name: Terraform (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, digitalocean, azure, gcp]
    defaults:
      run:
        working-directory: deploy/terraform/${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Check formatting
        run: terraform fmt -check
      - name: Initialize providers
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate -no-color
      - name: Test deployment plan
        run: terraform test -no-color

  containers:
    name: Container contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          DOKOSOKO_DATABASE_PASSWORD: ci-database-password
          DOKOSOKO_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DOKOSOKO_SETUP_TOKEN: ci-setup-token-with-sufficient-length
        run: docker compose config --quiet
      - name: Build service image
        run: docker build --tag dokosoko-service:ci .
      - name: Build crawler image
        run: docker build --file Dockerfile.crawler --tag dokosoko-crawler:ci .
