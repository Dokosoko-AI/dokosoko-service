services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backend_integration
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend_integration"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - backend-integration-postgres:/var/lib/postgresql/data

  backend-integration:
    build: .
    environment:
      LISTEN_ADDR: :8081
      DATABASE_URL: postgres://backend:local-development-only@postgres:5432/backend_integration?sslmode=disable
      DOKOSOKO_BACKEND_BEARER_TOKEN: local-example-backend-token-change-me
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

volumes:
  backend-integration-postgres:
